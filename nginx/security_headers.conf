# Shared response security headers for the production nginx server.
# F-NGINX-HEADERS-001: X-XSS-Protection is added at the edge so static
# assets served directly by nginx (bypassing the FastAPI XSS header
# middleware) still get the reflection-based XSS heuristic block.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; form-action 'self'" always;
