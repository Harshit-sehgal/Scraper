# =============================================================================
# DataForge Scraper — Docker Compose Dev Overrides
# =============================================================================
# Automatically merged with docker-compose.yml when running:
#   docker compose up
#
# These overrides are for local development only — not used in production.
# =============================================================================

services:
  dataforge:
    # Opt into the dev Docker stage and enable uvicorn --reload. This is
    # no longer the default — both flags must be set explicitly so a
    # fresh ``docker compose up`` against the production stack ships the
    # safe base config.
    build:
      target: dev
    environment:
      - DATAFORGE_ENABLE_RELOAD=1
      - PYTHONDEVMODE=1
      - DATAFORGE_LOGGING_LEVEL=DEBUG
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    # Show live container logs
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
