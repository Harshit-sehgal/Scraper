# =============================================================================
# DataForge Scraper — Docker Compose (Development)
# =============================================================================
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down -v
#
# Production: see docker-compose.prod.yml
# =============================================================================
# `version` is a deprecated top-level key in Compose v2, but Compose
# v1 (still present on some CI images) requires it. Drop once v1 is
# fully retired.
version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  dataforge:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: dataforge:${DATAFORGE_IMAGE_TAG:-latest}
    container_name: dataforge-scraper
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATAFORGE_ENV=development
    volumes:
      # Source code mounted for hot-reload
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      # Persistent data across restarts
      - dataforge_data:/app/backend/data
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import http.client,sys; c=http.client.HTTPConnection('localhost', 8000, timeout=4); c.request('GET', '/ready'); r=c.getresponse(); sys.exit(0 if 200 <= r.status < 500 else 1)"
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s
    logging: *default-logging
    # Dev-specific resource limits (relaxed)
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    networks:
      - dataforge-net

volumes:
  dataforge_data:
    name: dataforge_scraper_data

networks:
  dataforge-net:
    name: dataforge_network
    driver: bridge
