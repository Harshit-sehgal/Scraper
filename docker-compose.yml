# =============================================================================
# DataForge Scraper — Docker Compose (Development)
# =============================================================================
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down -v
#
# Production: see docker-compose.prod.yml
# =============================================================================
# The deprecated top-level ``version`` key is intentionally omitted
# (Compose v2 ignores it; Compose v1 is end-of-life). Some
# interactive ``docker compose config`` invocations still warn on
# its presence, which is why we removed it.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  dataforge:
    build:
      context: .
      dockerfile: Dockerfile
      # Default to the production stage so a fresh ``docker compose up``
      # does not boot a hot-reload, debug-logging stack. Developers who
      # need live-reload opt in explicitly via the
      # ``docker-compose.override.yml`` file (sets ``target: dev`` and
      # ``DATAFORGE_ENABLE_RELOAD=1``).
      target: production
    image: dataforge:${DATAFORGE_IMAGE_TAG:-latest}
    container_name: dataforge-scraper
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATAFORGE_ENV=development
    volumes:
      # Source code mounted for hot-reload
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      # Persistent data across restarts
      - dataforge_data:/app/backend/data
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import http.client,sys; c=http.client.HTTPConnection('localhost', 8000, timeout=4); c.request('GET', '/ready'); r=c.getresponse(); sys.exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s
    logging: *default-logging
    # Dev-specific resource limits (relaxed)
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    networks:
      - dataforge-net

volumes:
  dataforge_data:
    name: dataforge_scraper_data

networks:
  dataforge-net:
    name: dataforge_network
    driver: bridge
