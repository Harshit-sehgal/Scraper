# =============================================================================
# DataForge Scraper — Docker Compose
# =============================================================================
# Start:   docker compose up -d
# Logs:    docker compose logs -f
# Stop:    docker compose down
# =============================================================================

services:
  dataforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataforge-scraper
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount state file for persistence across restarts
      - dataforge_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  dataforge_data:
