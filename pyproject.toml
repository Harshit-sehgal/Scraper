[project]
name = "dataforge-scraper"
version = "0.1.0"
description = "A FastAPI + Playwright web extraction platform"
authors = [
    { name = "Harshit Sehgal" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
# ─── Dependencies ──────────────────────────────────────────────────────────
# This file is the single source of truth for both production and dev
# dependencies (PEP 621 standard). The legacy backend/requirements*.in and
# *.lock.txt files have been removed. Production installs use
# ``pip install .``; dev installs use ``pip install -e ".[dev]"``.
# Bounds are validated by ``scripts/validate_dependency_bounds.py``.
# =============================================================================
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "playwright>=1.45.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "httpcore>=1.0.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=5.0.0,<7.0.0",
    "duckduckgo_search>=5.0.0,<9.0.0",
    "ddgs>=9.0.0,<10.0.0",
    "pandas>=2.0.0,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "starlette>=0.36.0,<1.0.0",
    "g4f>=0.5.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "geopy>=2.4.0,<3.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "aiofiles>=23.0.0,<26.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "requests>=2.31.0,<3.0.0"
]

[project.optional-dependencies]
# ─── Dev dependencies ────────────────────────────────────────────────────
# Installed with ``pip install -e ".[dev]"``. Dev-only packages MUST NOT
# appear in the production ``[project].dependencies`` list; the
# ``scripts/validate_dependency_bounds.py`` gate enforces this.
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "testcontainers[postgres]>=4.0.0,<5.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "pytest-rerunfailures>=15.0.0,<20.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "ruff~=0.15.0",
    "mypy>=1.0.0",
    "pyflakes>=3.2.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0"
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # All docstring rules — stylistic preference for scraper codebase
    "D",
    # Type annotations — project uses mypy for type checking
    "ANN",
    # Package structure — intentional
    "INP001",
    # Blind except — many are intentional broad catches
    "BLE001",
    # Magic value comparisons — too numerous (~1700) and many are intentional
    "PLR2004",
    # Private member access — many are legitimate internal/test access patterns
    "SLF001",
    # Variable/function naming conventions — codebase uses UPPER_CASE for local constants
    "N806", "N802", "N811", "N813", "N817", "N818",
    # Global statements — many are intentional module-level singletons
    "PLW0603",
    # Module-level import not at top of file
    "PLW0406",
    # Complexity rules — pre-existing high-complexity functions
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    # Boolean positional arguments — API patterns
    "FBT001", "FBT002", "FBT003",
    # Pathlib suggestions — codebase uses os.path in many places
    "PTH",
    # List comprehension preference
    "PERF401",
    # Broad exception in specific contexts
    "PGH003",
    # Existing ignores from original config
    "E203", "E501", "B904", "B905", "B007", "B027", "B008", "E402", "B023",
    "TRY300", "TRY301", "TRY003", "S311", "ASYNC109", "RUF006", "TC003", "TC001", "PLC0415", "UP047",
    "PYI036", "PYI046", "PLW2901", "S104",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"backend/tests/*" = ["S101", "ARG001", "ARG002", "ARG005", "TRY003", "S108", "S106", "S105", "S311", "S113", "S310", "S603", "S104", "RUF059", "RUF043", "RUF012", "RUF003", "SIM117", "SIM102", "SIM118", "SIM105", "TRY300", "TRY301", "TRY002", "ASYNC240", "ASYNC230", "ASYNC109", "TC003", "TC002", "A002", "A003", "N805", "PLW1510", "DTZ005", "ERA001", "PT", "PERF102", "PERF402", "LOG015", "S107"]
"backend/benchmarks/*" = ["S101", "ARG001", "ARG005", "S110", "S311"]
"scripts/*" = [
    "S603",
    # CLI tools: legitimately use print() for stdout output, os.path for compat, etc.
    "T201", "T203",
    "PTH",  # all pathlib rules
    "EXE001",
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # complexity
    "PLR2004", "SLF001",
    "ARG001", "ARG002", "ARG005",
    "PERF401",
    "FBT001", "FBT002", "FBT003",
    "DTZ005", "DTZ006",
    "PLW1510",
    "PLW2901",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# The ``ignore_errors = true`` override was removed in Round 24 because it
# silently hid type errors across 7 modules. The override section is
# intentionally empty — if project constraints later require one, prefer
# a narrow ``disable_error_code = ["..."]`` over blanket suppression.

[tool.pytest.ini_options]
testpaths = ["backend/tests", "backend/benchmarks"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "module"
# Global per-test timeout. Hangs in unit/API tests will fail fast instead
# of stalling CI. Tests that legitimately need longer must declare
# ``@pytest.mark.timeout(N)`` (overrides this default) or be marked ``slow``.
addopts = "-q --timeout=30"
markers = [
    "integration: marks tests as integration/optional (live API calls). Skipped by default.",
    "postgres: tests that require a running Postgres instance (via testcontainers). Skipped by default.",
    "browser: tests that require Playwright/browser runtime and local HTTP server binding. Skipped by default.",
    "golden_dataset: tests that hit real websites for extraction validation. Skipped by default (use --run-golden-dataset).",
    "live_benchmark: marks tests that require live-internet access for benchmarking. Skipped by default (use --run-live-benchmark).",
    "network: tests that intentionally make live DNS/HTTP calls. The conftest autouse DNS stand-in is bypassed. Skipped by default in CI sandboxes without network access.",
    "unit: fast unit tests that must not touch the network, database, or filesystem beyond the test's own tmp dir.",
    "api: API contract tests that exercise the FastAPI app via the in-process ASGI client.",
    "slow: tests whose expected runtime is > 5s. Useful for selective CI tiers.",
    "timeout: marks tests to run with a timeout",
    "accuracy: benchmark tests measuring extraction accuracy (F1, precision, recall).",
    "performance: benchmark tests measuring latency, throughput, and pages per minute.",
    "reliability: benchmark tests measuring error rates, timeout rates, and success rates.",
    "resource: benchmark tests measuring memory and CPU usage.",
    "scalability: benchmark tests measuring concurrent job handling and throughput under load.",
    "comprehensive: benchmark tests producing full reports across all categories.",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/benchmarks/*"]

[tool.coverage.report]
# Minimum thresholds for core modules (steady improvement targets).
# The global floor is raised in lockstep with the test suite; per-module
# minimums are enforced by ``scripts/check_coverage_floors.py``.
fail_under = 60
show_missing = true
skip_covered = false
precision = 1

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __getattr__",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "coverage_html"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

# ─── Deptry ───────────────────────────────────────────────────────────────
# `app` is the first-party package; scripts/ at the project root import from
# it but deptry doesn't auto-detect this layout. Excluding `scripts/*` from
# the missing-dep scan and mapping `bs4`→`beautifulsoup4` keeps the report
# clean. `requirements_files` points deptry at pyproject.toml so the
# canonical source of truth is used.
[tool.deptry]
exclude = ["scripts/*", ".pylint_venv/**", ".venv/**", "data/**", "logs/**"]
requirements_files = ["pyproject.toml"]
# DEP002 = unused-dependency: CLI-only dev tools (ruff, mypy, bandit,
# pip-audit, pyflakes, pytest-*) are used via subprocess / entrypoints,
# not as imports. Libraries (lxml, pandas, aiosqlite, aiofiles, aiohttp)
# are transitive / future-use deps retained in the direct stack.
# DEP003 = transitive-dependency: psycopg_pool, scripts, conftest are
# internal-only modules and pytest test fixtures.
ignore = ["DEP002", "DEP003"]

[tool.deptry.package_module_name_map]
"beautifulsoup4" = ["bs4"]
"duckduckgo_search" = ["duckduckgo_search"]
"prometheus-client" = ["prometheus_client"]
"PyYAML" = ["yaml"]
"python-dotenv" = ["dotenv"]
"psycopg2-binary" = ["psycopg2"]
"psycopg[binary,pool]" = ["psycopg", "psycopg_pool"]

# ─── Bandit ───────────────────────────────────────────────────────────────
# The core product code in ``backend/app/`` is held to a strict Bandit
# default. Per-file `# nosec` annotations with justification are used
# in ``scripts/`` for the few operational tooling files where the
# patterns Bandit warns about are intentional and constrained to
# hardcoded command vectors / local probe URLs.
#
# B101 (``assert_used``) is skipped for pytest test files because
# pytest's assertion rewriting is the idiomatic, encouraged pattern
# for test cases. Benchmarks converted to use a runtime ``_check()``
# helper so they survive ``python -O``.
[tool.bandit]
exclude_dirs = [".venv", "data", "logs"]
skips = [
    "B101",
]
