[project]
name = "dataforge-scraper"
version = "0.1.0"
description = "A FastAPI + Playwright web extraction platform"
authors = [
    { name = "Harshit Sehgal" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "playwright>=1.45.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=5.0.0,<7.0.0",
    "duckduckgo_search>=5.0.0,<9.0.0",
    "ddgs>=9.0.0,<10.0.0",
    "pandas>=2.0.0,<4.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "geopy>=2.4.0,<3.0.0",
    "prometheus-client>=0.19.0,<1.0.0",
    "aiofiles>=23.0.0,<26.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "requests>=2.31.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "testcontainers[postgres]>=4.0.0,<5.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-timeout>=2.3.0",
    "PyYAML>=6.0.0,<7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E203", "E501", "B904", "B905", "B007", "B027", "B008", "E402", "B023"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "app.semantic_world_state.core",
    "app.semantic_world_state.events",
    "app.semantic_world_state.memory",
    "app.semantic_world_state.metrics",
    "app.semantic_world_state.serialization",
    "app.semantic_world_state.topology",
    "app.semantic_world_state.locks"
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "backend/benchmarks"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "module"
addopts = "-q"
markers = [
    "integration: marks tests as integration/optional (live API calls). Skipped by default.",
    "postgres: tests that require a running Postgres instance (via testcontainers). Skipped by default.",
    "browser: tests that require Playwright/browser runtime and local HTTP server binding. Skipped by default.",
    "golden_dataset: tests that hit real websites for extraction validation. Skipped by default (use --run-golden-dataset).",
    "timeout: marks tests to run with a timeout"
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/benchmarks/*"]

[tool.coverage.report]
# Minimum thresholds for core modules (steady improvement targets)
fail_under = 50
show_missing = true
skip_covered = false
precision = 1

exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __getattr__",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "coverage_html"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

# ─── Bandit ───────────────────────────────────────────────────────────────
# The core product code in ``backend/app/`` is held to a strict Bandit
# default. Per-file `# nosec` annotations with justification are used
# in ``scripts/`` for the few operational tooling files where the
# patterns Bandit warns about are intentional and constrained to
# hardcoded command vectors / local probe URLs.
#
# B101 (``assert_used``) is skipped for pytest test files because
# pytest's assertion rewriting is the idiomatic, encouraged pattern
# for test cases. Benchmarks converted to use a runtime ``_check()``
# helper so they survive ``python -O``.
[tool.bandit]
exclude_dirs = [".venv", "data", "logs"]
skips = [
    "B101",
]
