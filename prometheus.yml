# =============================================================================
# DataForge Scraper — Prometheus Configuration
# =============================================================================
# Scrapes metrics from the DataForge application server and exports
# them to Grafana for visualization.
#
# Reload config:  curl -X POST http://localhost:9090/-/reload
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: 'dataforge'
    env:     'production'

# Rule files are evaluated locally. Alertmanager routing is intentionally
# omitted until an alertmanager service and routing config are deployed.
rule_files:
  - "prometheus_alerts.yml"

scrape_configs:
  # ─── Prometheus Self-monitoring ──────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── DataForge Application Metrics ──────────────────────────────────
  - job_name: 'dataforge'
    metrics_path: '/metrics'
    # If DATAFORGE_METRICS_TOKEN is set on the dataforge container, you MUST
    # configure Prometheus to authenticate. Choose ONE of:
    #
    # Option A — Direct token (for testing only):
    #   bearer_token: "<your-metrics-token>"
    #
    # Option B — Token from file (production, via docker secret):
    #   bearer_token_file: "/etc/prometheus/metrics_token"
    #
    # The docker-compose.prod.yml sets DATAFORGE_METRICS_TOKEN via
    # environment variable. Mount the token into the Prometheus container
    # as a file and use bearer_token_file for production.
    #
    # Alternatively, if DATAFORGE_METRICS_TOKEN is empty/not set, the
    # /metrics endpoint accepts requests without auth (recommended when
    # /metrics is served only on an internal Docker network).
    static_configs:
      - targets: ['dataforge:8000']
        labels:
          service: 'scraper'
          component: 'api'

  # ─── PostgreSQL Exporter (if enabled) ───────────────────────────────
  # Disabled until a postgres-exporter service is added to
  # docker-compose.prod.yml.
  # - job_name: 'postgres'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgres'
  #         component: 'database'

  # ─── Nginx Metrics (via stub_status or exporter) ────────────────────
  # Disabled until stub_status location is added to nginx.conf.
  # - job_name: 'nginx'
  #   metrics_path: '/nginx_status'
  #   static_configs:
  #     - targets: ['nginx:80']
  #       labels:
  #         service: 'nginx'
  #         component: 'reverse-proxy'
