# =============================================================================
# DataForge Scraper — Prometheus Configuration
# =============================================================================
# Scrapes metrics from the DataForge application server and exports
# them to Grafana for visualization.
#
# Reload config:  curl -X POST http://localhost:9090/-/reload
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: 'dataforge'
    env:     'production'

# Rule files are evaluated locally.
rule_files:
  - "/etc/prometheus/prometheus_alerts.yml"

# ─── Alertmanager ─────────────────────────────────────────────────────
alerting:
  alert_relabel_configs:
    # Drop labels that are not needed in alerts to reduce cardinality.
    # ``__name__`` is a reserved label and CANNOT be labeldrop'd — using
    # it in the regex causes Prometheus to refuse the config. We drop
    # the actual instance label the Prometheus self-scrape adds so it
    # doesn't leak into the alert stream.
    - action: labeldrop
      regex: "^(prometheus_instance|prometheus)$"
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      scheme: http
      timeout: 10s
      api_version: v2

scrape_configs:
  # ─── Prometheus Self-monitoring ──────────────────────────────────────
  # Use the service name (resolved by Docker DNS) rather than
  # ``localhost`` so the self-scrape works regardless of which
  # network the container is attached to. ``localhost`` inside
  # the prometheus container would still hit the prometheus
  # process, but only because the metrics endpoint listens on
  # 0.0.0.0; using the service name makes the intent obvious and
  # matches the other scrape job targets below.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
    relabel_configs:
      - target_label: instance
        replacement: prometheus-self

  # ─── DataForge Application Metrics ──────────────────────────────────
  - job_name: 'dataforge'
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials: "__DATAFORGE_METRICS_TOKEN__"
    static_configs:
      - targets: ['dataforge:8000']
        labels:
          service: 'scraper'
          component: 'api'

  # ─── DataForge Readiness Probe (no metrics token required) ───────────
  # Distinguishes "API is down" from "Prometheus metrics token is wrong".
  - job_name: 'blackbox-dataforge-ready'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://dataforge:8000/ready
        labels:
          service: 'scraper'
          component: 'api-readiness'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ─── Alertmanager Health ────────────────────────────────────────────
  - job_name: 'alertmanager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          component: 'alerting'

  # ─── PostgreSQL Exporter ────────────────────────────────────────────
  - job_name: 'postgres'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # ─── Nginx Metrics (via stub_status or exporter) ────────────────────
  # Disabled until stub_status location is added to nginx.conf.
  # - job_name: 'nginx'
  #   metrics_path: '/nginx_status'
  #   static_configs:
  #     - targets: ['nginx:80']
  #       labels:
  #         service: 'nginx'
  #         component: 'reverse-proxy'

  # ─── Node Exporter (host metrics) ────────────────────────────────────
  # F-MON-004: CPU, memory, disk, network, and filesystem metrics from
  # the host. Powers NodeExporterHealth and NodeFilesystemSpaceFillingUp.
  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'host'

  # ─── cAdvisor (container metrics) ────────────────────────────────────
  # F-MON-004: per-container CPU, memory, and I/O metrics.
  # Powers ContainerOOMKillPending and container health alerts.
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'containers'

  # ─── TLS Certificate Expiry Probe ────────────────────────────────────
  # F-MON-004: probes TLS handshake against the public HTTPS endpoint
  # and exposes probe_ssl_earliest_cert_expiry. The target URL must be
  # set via DATAFORGE_TLS_PROBE_TARGET env var (e.g. https://your.domain).
  - job_name: 'blackbox-tls'
    metrics_path: /probe
    params:
      module: [tls_connect]
    static_configs:
      - targets:
          - __DATAFORGE_TLS_PROBE_TARGET__
        labels:
          service: 'nginx'
          component: 'tls'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
