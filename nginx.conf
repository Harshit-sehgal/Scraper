# =============================================================================
# DataForge Scraper — nginx Reverse Proxy Configuration
# =============================================================================
# Used by docker-compose.prod.yml. Proxies API requests to the uvicorn
# app server and serves the frontend dashboard directly for performance.
#
# For SSL termination, see the commented-out section below.
# =============================================================================

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ─── Basic Settings ────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;
    server_tokens off;

    # ─── MIME Types ────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ─── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # ─── Rate Limiting Zones ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=jobs:10m rate=5r/s;
    limit_req_status 429;

    # ─── Upstream ──────────────────────────────────────────────────────────
    upstream dataforge_api {
        # Round-robin across multiple app instances if scaled
        server dataforge:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ─── Server ────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # ─── Security Headers ──────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ─── Root Health Check ─────────────────────────────────────────────
        location = /health {
            proxy_pass http://dataforge_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            break;
        }

        location = /ready {
            proxy_pass http://dataforge_api/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            break;
        }

        # ─── API Proxy ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://dataforge_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "keep-alive";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }

        # ─── FastAPI Docs (blocked at proxy level for security) ────────────
        location /docs {
            return 404;
        }
        location /redoc {
            return 404;
        }
        location /openapi.json {
            return 404;
        }

        # ─── Frontend Static Assets (served directly by nginx with caching) ─
        location /app/styles.css {
            alias /usr/share/nginx/html/frontend/styles.css;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        location /app/app.js {
            alias /usr/share/nginx/html/frontend/app.js;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Frontend Dashboard (proxy to FastAPI, which handles SPA routing) ─
        location /app/ {
            proxy_pass http://dataforge_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /app {
            return 302 /app/;
        }

        location /dashboard/ {
            proxy_pass http://dataforge_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /dashboard {
            return 302 /dashboard/;
        }

        # ─── Static Assets (cached, served directly by nginx) ──────────────
        location /styles.css {
            root /usr/share/nginx/html/frontend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /app.js {
            root /usr/share/nginx/html/frontend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Let's Encrypt (for SSL) ───────────────────────────────────────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ─── Fallback ──────────────────────────────────────────────────────
        location / {
            return 404;
        }
    }

    # ─── SSL Server Block (uncomment and customize for HTTPS) ──────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     include /etc/nginx/conf.d/ssl-headers.conf;
    #
    #     # Same location blocks as above...
    # }
}
