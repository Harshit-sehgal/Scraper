# =============================================================================
# DataForge Scraper — nginx Reverse Proxy Configuration
# =============================================================================
# Used by docker-compose.prod.yml. Proxies API requests to the uvicorn
# app server and serves the frontend dashboard directly for performance.
#
# TLS posture: the recommended deployment is HTTPS-first. The default
# config below ships BOTH server blocks:
#
#   1. HTTPS block (port 443) — the production path. HSTS is set ONLY

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
#      here (browsers ignore HSTS over plain HTTP — see MDN).
#   2. HTTP block (port 80)    — issues a 301 redirect to HTTPS.
#      A separate, clearly-marked dev server is provided below for
#      environments that cannot obtain a certificate (e.g. local
#      docker-compose without a domain).
#
# To enable TLS, set the following env vars in the nginx container:
#   DATAFORGE_TLS_ENABLED=true
#   DATAFORGE_TLS_CERT=/etc/letsencrypt/live/<your-domain>/fullchain.pem
#   DATAFORGE_TLS_KEY=/etc/letsencrypt/live/<your-domain>/privkey.pem
# and provide a certbot / cert-manager sidecar. The HTTPS block below
# uses those vars (substituted at container start by envsubst).
# =============================================================================

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ─── Basic Settings ────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # ``client_max_body_size`` must be at least as small as the
    # backend's :data:`MAX_BODY_SIZE` (5 MB in
    # ``app.middlewares``) so the proxy rejects oversized payloads
    # at the edge instead of buffering them and only later returning
    # a 413 from the app. Mismatched values used to be 10 MB here
    # and 5 MB on the app — large requests accumulated in the proxy
    # buffers before the app rejected them.
    client_max_body_size 5m;
    server_tokens off;

    # ─── Docker DNS Resolver (for upstream hostname resolution) ───────────
    # Required so that nginx -t does not try to resolve 'dataforge' at
    # config-load time. Works in conjunction with the 'resolve' flag on
    # the upstream server directive.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─── MIME Types ────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ─── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # ─── Rate Limiting Zones ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # ─── Upstream ──────────────────────────────────────────────────────────
    upstream dataforge_api {
        # Shared memory required for runtime DNS resolution (resolve flag).
        zone dataforge_api 64k;
        # Round-robin across multiple app instances if scaled
        server dataforge:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ─── Shared response headers (set on every response from the HTTP
    #     context, then reinforced inside the HTTPS block where the HSTS
    #     header must NOT appear over plain HTTP).
    # ──────────────────────────────────────────────────────────────────────
    map $scheme $is_https {
        https 1;
        default 0;
    }

    # ──────────────────────────────────────────────────────────────────────
    # Server block A — HTTPS (production)
    # ──────────────────────────────────────────────────────────────────────
    # Only loaded when DATAFORGE_TLS_ENABLED=true. The cert paths are
    # substituted at container start by envsubst. If you deploy without
    # TLS (e.g. behind another TLS-terminating proxy), set
    # DATAFORGE_TLS_ENABLED=false and use server block C.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        absolute_redirect off;

        ssl_certificate     ${DATAFORGE_TLS_CERT};
        ssl_certificate_key ${DATAFORGE_TLS_KEY};
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS belongs HERE, not in the HTTP block — browsers ignore it
        # over plain HTTP. 2 years, subdomains. The ``preload`` token
        # is deliberately omitted until the domain is committed to
        # https://hstspreload.org — submitting prematurely is hard to
        # undo and ``preload`` also locks the directive shape (any
        # future change risks accidental removal from the preload
        # list).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ─── Security Headers ──────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; form-action 'self'" always;

        # ─── Root Health Check ─────────────────────────────────────────────
        location = /health {
            proxy_pass http://dataforge_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            break;
        }

        location = /ready {
            proxy_pass http://dataforge_api/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            break;
        }

        # ─── API Proxy ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://dataforge_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }

        # ─── FastAPI Docs & Metrics (blocked at proxy level for security) ──
        location /docs       { return 404; }
        location /redoc      { return 404; }
        location /openapi.json { return 404; }
        location /metrics    { return 404; }

        # ─── Frontend Static Assets (served directly by nginx with caching) ─
         location /app/styles.css {
            alias /usr/share/nginx/html/frontend/styles.css;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        location /app/app.js {
            alias /usr/share/nginx/html/frontend/app.js;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        location /app/favicon.svg {
            alias /usr/share/nginx/html/frontend/favicon.svg;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Frontend Dashboard (proxy to FastAPI, which handles SPA routing) ─
        location /app/ {
            proxy_pass http://dataforge_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /app { return 302 /app/; }

        location /dashboard/ {
            proxy_pass http://dataforge_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /dashboard { return 302 /dashboard/; }

        # ─── Static Assets (cached, served directly by nginx) ──────────────
        location /styles.css {
            root /usr/share/nginx/html/frontend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        location /app.js {
            root /usr/share/nginx/html/frontend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        location /favicon.svg {
            root /usr/share/nginx/html/frontend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Smoke test page (deterministic local HTML for smoke tests) ───
        location /smoke/ {
            alias /usr/share/nginx/html/frontend/smoke/;
        }

        location / { return 404; }
    }

    # ──────────────────────────────────────────────────────────────────────
    # Server block B — HTTP → HTTPS redirect (production)
    # ──────────────────────────────────────────────────────────────────────
    # Force HTTPS for everything that does not hit the ACME challenge path.
    # 301 (permanent) so the redirect is cached by well-behaved clients.
    server {
        listen 80 default_server;
        server_name _;

        # Allow ACME http-01 challenges to reach certbot over plain HTTP.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health probes: proxy to the FastAPI upstream so the response
        # shape matches the HTTPS block AND the smoke test (which
        # expects ``{"status":"ok"}`` JSON). Returning a hard-coded
        # ``ok\n`` text/plain would fail the smoke_prod_stack.sh
        # json-parse assertion. The probe endpoint itself does not
        # return sensitive data, so proxying to the same path on
        # the upstream is safe.
        location = /health {
            proxy_pass http://dataforge_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }
        location = /ready {
            proxy_pass http://dataforge_api/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # Everything else: 301 to HTTPS, preserving path and query.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────────────────────────────
    # Server block C — HTTP-only (development / behind an external TLS proxy)
    # ──────────────────────────────────────────────────────────────────────
    # Use this if you cannot obtain a certificate, e.g. local docker-compose
    # without a domain, or if another proxy (Cloudflare, AWS ALB, etc.) is
    # already terminating TLS. Set DATAFORGE_TLS_ENABLED=false in the
    # container env to skip the HTTPS block and uncomment this one.
    #
    # NOTE: HSTS is deliberately NOT set here. It only takes effect when
    # served over HTTPS, so emitting it on plain HTTP is a no-op (and a
    # misleading one at that). See MDN:
    # https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
    #
    # server {
    #     listen 80 default_server;
    #     server_name _;
    #     absolute_redirect off;
    #
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #     add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    #     add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'" always;
