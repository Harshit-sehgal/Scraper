# =============================================================================
# DataForge Scraper — Docker Compose (Production)
# =============================================================================
# Full production stack with nginx reverse proxy.
#
# Start:  docker compose -f docker-compose.prod.yml up -d
# Logs:   docker compose -f docker-compose.prod.yml logs -f
# Stop:   docker compose -f docker-compose.prod.yml down
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Application Server ──────────────────────────────────────────────────
  dataforge:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dataforge:latest
    container_name: dataforge-scraper
    # Not exposed directly to the internet — behind nginx
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATAFORGE_ENV=production
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TMPDIR=/tmp
    volumes:
      - dataforge_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; http.client.HTTPConnection('localhost', 8000).request('GET', '/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 512m
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    networks:
      - dataforge-net

  # ─── Worker Queue ────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dataforge:latest
    container_name: dataforge-worker
    command: ["python", "scripts/run_worker.py"]
    env_file:
      - .env
    environment:
      - DATAFORGE_ENV=production
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TMPDIR=/tmp
      - DATAFORGE_WORKER=true
    volumes:
      - dataforge_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4"
        reservations:
          memory: 1g
          cpus: "1"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m
    networks:
      - dataforge-net

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dataforge-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=dataforge
      - POSTGRES_PASSWORD=${DATAFORGE_DB_PASSWORD:-dataforge}
      - POSTGRES_DB=dataforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
        reservations:
          memory: 256m
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    networks:
      - dataforge-net

  # ─── Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: dataforge-nginx
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
    depends_on:
      dataforge:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    networks:
      - dataforge-net

  # ─── Monitoring (Prometheus + Grafana) ───────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dataforge-prometheus
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - dataforge-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: dataforge-grafana
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    networks:
      - dataforge-net

volumes:
  dataforge_data:
    name: dataforge_scraper_data
  postgres_data:
    name: dataforge_postgres_data
  prometheus_data:
    name: dataforge_prometheus_data
  grafana_data:
    name: dataforge_grafana_data

networks:
  dataforge-net:
    name: dataforge_network
    driver: bridge
