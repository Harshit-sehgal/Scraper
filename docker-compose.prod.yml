# =============================================================================
# DataForge Scraper — Docker Compose (Production)
# =============================================================================
# Full production stack with nginx reverse proxy.
#
# Start:  DATAFORGE_IMAGE_TAG=<immutable-tag> docker compose -f docker-compose.prod.yml up -d --pull never
# Logs:   docker compose -f docker-compose.prod.yml logs -f
# Stop:   docker compose -f docker-compose.prod.yml down
# =============================================================================
# The deprecated top-level ``version`` key is intentionally omitted
# (Compose v2 ignores it; Compose v1 is end-of-life). Some
# interactive ``docker compose config`` invocations still warn on
# its presence, which is why we removed it.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Application Server ──────────────────────────────────────────────────
  dataforge:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dataforge:${DATAFORGE_IMAGE_TAG:?DATAFORGE_IMAGE_TAG is required for production deploys (F-DOCKER-005)}
    container_name: dataforge-scraper
    # Not exposed directly to the internet — behind nginx
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - DATAFORGE_ENV=production
      - DATAFORGE_API_KEY_FILE=/run/secrets/dataforge_api_key
      - DATAFORGE_OPERATOR_API_KEY_FILE=/run/secrets/dataforge_operator_api_key
      - DATAFORGE_ADMIN_API_KEY_FILE=/run/secrets/dataforge_admin_api_key
      - DATAFORGE_SESSION_SECRET_FILE=/run/secrets/dataforge_session_secret
      - DATAFORGE_STORAGE_BACKEND=postgres
      - DATAFORGE_PG_DRIVER=psycopg3
      - DATAFORGE_DATABASE_URL=postgresql://dataforge:${DATAFORGE_DB_PASSWORD:?DATAFORGE_DB_PASSWORD is required}@postgres:5432/dataforge
      - DATAFORGE_WORKER_QUEUE=true
      - DATAFORGE_QUEUE_BACKEND=postgres
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TMPDIR=/tmp
      - DATAFORGE_SMOKE_TEST_MODE=${DATAFORGE_SMOKE_TEST_MODE:-false}
      - DATAFORGE_ALLOWED_INTERNAL_HOSTS=${DATAFORGE_ALLOWED_INTERNAL_HOSTS:-}
      - DATAFORGE_SEMANTIC_STATE_PATH=/app/backend/data/semantic_state.json
      - DATAFORGE_AUDIT_LOG_DIR=/app/backend/data/logs
    volumes:
      - dataforge_data:/app/backend/data
    secrets:
      - dataforge_api_key
      - dataforge_operator_api_key
      - dataforge_admin_api_key
      - dataforge_session_secret
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost', 8000, timeout=8); c.request('GET', '/ready'); r=c.getresponse(); exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 512m
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    # ``init: true`` injects a tiny PID-1 reaper so any child
    # processes the app spawns (Playwright driver, etc.) are
    # cleaned up on container shutdown. Without it, zombies
    # accumulate and ``docker stop`` waits the full 10s grace
    # period on every restart.
    init: true
    networks:
      - dataforge-net

  # ─── Worker Queue ────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dataforge:${DATAFORGE_IMAGE_TAG:?DATAFORGE_IMAGE_TAG is required for production deploys (F-DOCKER-005)}
    container_name: dataforge-worker
    command: ["/app/scripts/start_worker.sh"]
    env_file:
      - .env.production
    environment:
      - DATAFORGE_ENV=production
      - DATAFORGE_API_KEY_FILE=/run/secrets/dataforge_api_key
      - DATAFORGE_OPERATOR_API_KEY_FILE=/run/secrets/dataforge_operator_api_key
      - DATAFORGE_ADMIN_API_KEY_FILE=/run/secrets/dataforge_admin_api_key
      - DATAFORGE_SESSION_SECRET_FILE=/run/secrets/dataforge_session_secret
      - DATAFORGE_STORAGE_BACKEND=postgres
      - DATAFORGE_PG_DRIVER=psycopg3
      - DATAFORGE_DATABASE_URL=postgresql://dataforge:${DATAFORGE_DB_PASSWORD:?DATAFORGE_DB_PASSWORD is required}@postgres:5432/dataforge
      - DATAFORGE_WORKER_QUEUE=true
      - DATAFORGE_QUEUE_BACKEND=postgres
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TMPDIR=/tmp
      - DATAFORGE_WORKER=true
      - DATAFORGE_SMOKE_TEST_MODE=${DATAFORGE_SMOKE_TEST_MODE:-false}
      - DATAFORGE_ALLOWED_INTERNAL_HOSTS=${DATAFORGE_ALLOWED_INTERNAL_HOSTS:-}
      - DATAFORGE_SEMANTIC_STATE_PATH=/app/backend/data/semantic_state.json
      - DATAFORGE_AUDIT_LOG_DIR=/app/backend/data/logs
    volumes:
      - dataforge_data:/app/backend/data
    secrets:
      - dataforge_api_key
      - dataforge_operator_api_key
      - dataforge_admin_api_key
      - dataforge_session_secret
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Check that the worker process is alive by verifying a recent
      # heartbeat exists in the database. The worker writes a heartbeat
      # every 15 seconds (configurable via --heartbeat-interval); if the
      # heartbeat is older than 60 seconds the worker is considered dead.
      #
      # This replaces the PID-based ``os.kill(pid, 0)`` approach which
      # was brittle (PID reuse, stuck processes still have a PID).
      test: ["CMD", "python", "/app/scripts/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4"
        reservations:
          memory: 1g
          cpus: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m
    init: true
    networks:
      - dataforge-net

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dataforge-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=dataforge
      - POSTGRES_PASSWORD=${DATAFORGE_DB_PASSWORD:?DATAFORGE_DB_PASSWORD is required}
      - POSTGRES_DB=dataforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d:ro
    # Postgres opens a socket per connection plus a handful of
    # internal FDs (WAL, replication, autovacuum workers). The
    # default 1024 ulimit is fine for trivial databases but
    # quickly clips under load with many concurrent workers.
    # Bump to 65536 to match the upstream-recommended value for
    # production Postgres deployments.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
        reservations:
          memory: 256m
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    networks:
      - dataforge-net

  # ─── Postgres Exporter ────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: dataforge-postgres-exporter
    expose:
      - "9187"
    # Use ``PG_*_FILE`` env vars (postgres_exporter ≥ v0.10) so the
    # password is loaded from a file mounted at /run/secrets. The
    # previous ``DATA_SOURCE_NAME`` env var embedded the plaintext
    # password on the container, which is visible in ``docker
    # inspect`` and in the process list of the exporter. The DSN
    # is still built from those individual fields by the exporter,
    # so callers see the same connection.
    environment:
      PG_USER_FILE: /run/secrets/pg_exporter_user
      PG_PASSWORD_FILE: /run/secrets/pg_exporter_password
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: dataforge
      # ``prefer`` lets the exporter fall back to a plaintext
      # connection if the server doesn't advertise SSL. The
      # alternative ``require`` would refuse to start against the
      # SSL-less postgres container in this compose file. The data
      # network is internal-only (``dataforge-net``), so plaintext
      # is acceptable here. Bump to ``verify-full`` and mount a
      # server cert when running across an untrusted network.
      PG_SSLMODE: prefer
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "true"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./postgres-queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    secrets:
      - pg_exporter_user
      - pg_exporter_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true
    init: true
    networks:
      - dataforge-net

  # ─── Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: dataforge-nginx
    ports:
      - "${HOST:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HOST:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - ${DATAFORGE_NGINX_SSL_DIR:-./.secrets/nginx}:/etc/nginx/ssl:ro
      - ${DATAFORGE_CERTBOT_WEBROOT:-./.secrets/certbot/www}:/var/www/certbot:ro
    depends_on:
      dataforge:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    init: true
    networks:
      - dataforge-net

  # ─── Monitoring (Prometheus + Grafana) ───────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dataforge-prometheus
    expose:
      - "9090"
    env_file:
      - .env.production
    environment:
      - DATAFORGE_METRICS_TOKEN=${DATAFORGE_METRICS_TOKEN:?DATAFORGE_METRICS_TOKEN is required}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml:ro
      # web.yml is still mounted for future TLS/basic-auth settings.
      # Runtime lifecycle reload is disabled by default because this
      # file intentionally has no basic_auth_users.
      - ./prometheus_web.yml:/etc/prometheus/web.yml:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s|__DATAFORGE_METRICS_TOKEN__|$${DATAFORGE_METRICS_TOKEN}|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        if grep -q '__DATAFORGE_METRICS_TOKEN__' /tmp/prometheus.yml; then
          echo "ERROR: prometheus.yml token substitution failed (placeholder remains)" >&2
          exit 1
        fi
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles \
          --web.config.file=/etc/prometheus/web.yml
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    init: true
    networks:
      - dataforge-net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: dataforge-blackbox-exporter
    expose:
      - "9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true
    init: true
    networks:
      - dataforge-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: dataforge-grafana
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      # Grafana reads the admin password from a file path when the
      # env var ends in ``__FILE`` (note the double underscore —
      # this is a Grafana convention, not a Docker one). The file
      # is mounted from a Docker secret, so the plaintext password
      # is not visible in ``docker inspect``. The secret file must
      # contain only the password (no trailing newline stripping is
      # required — Grafana trims whitespace internally).
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    init: true
    networks:
      - dataforge-net

  # ─── Alertmanager ────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: dataforge-alertmanager
    expose:
      - "9093"
    env_file:
      - .env.production
    environment:
      - ALERTMANAGER_SMTP_HOST=${ALERTMANAGER_SMTP_HOST:-}
      - ALERTMANAGER_SMTP_USER=${ALERTMANAGER_SMTP_USER:-}
      - ALERTMANAGER_SMTP_PASS=${ALERTMANAGER_SMTP_PASS:-}
      - ALERTMANAGER_EMAIL_FROM=${ALERTMANAGER_EMAIL_FROM:-}
      - ALERTMANAGER_EMAIL_TO=${ALERTMANAGER_EMAIL_TO:-}
    volumes:
      # alertmanager.yml.template has placeholders that get
      # substituted at container start; the rendered file lives in
      # /tmp (tmpfs, never written to disk) so the webhook URL
      # never lands in a host-mounted file.
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      # The Slack webhook is mounted as a Docker secret so the
      # URL never appears in ``docker inspect`` env. The
      # entrypoint reads the secret, sets the env var, then
      # execs the alertmanager binary.
      - alertmanager_data:/alertmanager
    secrets:
      - slack_webhook
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /run/secrets/slack_webhook ]; then
          ALERTMANAGER_SLACK_WEBHOOK_URL="$$(cat /run/secrets/slack_webhook)"
        else
          ALERTMANAGER_SLACK_WEBHOOK_URL=''
        fi
        sed -e "s|__ALERTMANAGER_SLACK_WEBHOOK_URL__|$${ALERTMANAGER_SLACK_WEBHOOK_URL}|g" \
            -e "s|__ALERTMANAGER_SMTP_HOST__|$${ALERTMANAGER_SMTP_HOST:-}|g" \
            -e "s|__ALERTMANAGER_SMTP_USER__|$${ALERTMANAGER_SMTP_USER:-}|g" \
            -e "s|__ALERTMANAGER_SMTP_PASS__|$${ALERTMANAGER_SMTP_PASS:-}|g" \
            -e "s|__ALERTMANAGER_EMAIL_FROM__|$${ALERTMANAGER_EMAIL_FROM:-}|g" \
            -e "s|__ALERTMANAGER_EMAIL_TO__|$${ALERTMANAGER_EMAIL_TO:-}|g" \
          < /etc/alertmanager/alertmanager.yml.template \
          > /tmp/alertmanager.yml
        # Grep gate must list every `__ALERTMANAGER_*__` placeholder that
        # the sed chain above substitutes, so an unreplaced token always
        # fails the gate. The list mirrors docker-compose.override.local.yml
        # exactly (F-DOCKER-008).
        if grep -q '__ALERTMANAGER_SLACK_WEBHOOK_URL__\|__ALERTMANAGER_SMTP_HOST__\|__ALERTMANAGER_SMTP_USER__\|__ALERTMANAGER_SMTP_PASS__\|__ALERTMANAGER_EMAIL_FROM__\|__ALERTMANAGER_EMAIL_TO__' /tmp/alertmanager.yml; then
          echo 'ERROR: alertmanager template substitution failed' >&2
          exit 1
        fi
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=$${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093} \
          --cluster.listen-address=
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"
    init: true
    networks:
      - dataforge-net

volumes:
  alertmanager_data:
    name: dataforge_alertmanager_data
  dataforge_data:
    name: dataforge_scraper_data
  postgres_data:
    name: dataforge_postgres_data
  prometheus_data:
    name: dataforge_prometheus_data
  grafana_data:
    name: dataforge_grafana_data

# Secrets for ``dataforge``, ``worker``, ``postgres-exporter``, and ``alertmanager``. The files
# are generated by ``scripts/generate_prod_env.py`` (mode 0600) and
# consumed by the application entrypoints via ``DATAFORGE_*_FILE``,
# by the exporter via the ``PG_USER_FILE`` / ``PG_PASSWORD_FILE`` env
# vars, and by alertmanager via the entrypoint that reads
# ``slack_webhook``. This avoids putting plaintext API keys, session
# secrets, DB passwords, or Slack webhook URLs on any container's env
# list, which would be visible in ``docker inspect``.
secrets:
  dataforge_api_key:
    file: ./.secrets/dataforge_api_key
  dataforge_operator_api_key:
    file: ./.secrets/dataforge_operator_api_key
  dataforge_admin_api_key:
    file: ./.secrets/dataforge_admin_api_key
  dataforge_session_secret:
    file: ./.secrets/dataforge_session_secret
  pg_exporter_user:
    file: ./.secrets/pg_exporter_user
  pg_exporter_password:
    file: ./.secrets/pg_exporter_password
  slack_webhook:
    file: ./.secrets/slack_webhook
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password

networks:
  dataforge-net:
    name: dataforge_network
    driver: bridge
