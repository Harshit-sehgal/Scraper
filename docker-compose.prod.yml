# =============================================================================
# DataForge Scraper — Docker Compose (Production)
# =============================================================================
# Full production stack with nginx reverse proxy.
#
# Start:  docker compose -f docker-compose.prod.yml up -d
# Logs:   docker compose -f docker-compose.prod.yml logs -f
# Stop:   docker compose -f docker-compose.prod.yml down
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Application Server ──────────────────────────────────────────────────
  dataforge:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: dataforge:latest
    container_name: dataforge-scraper
    # Not exposed directly to the internet — behind nginx
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATAFORGE_ENV=production
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TMPDIR=/tmp
    volumes:
      - dataforge_data:/app/backend/data
    depends_on: []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; http.client.HTTPConnection('localhost', 8000).request('GET', '/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 512m
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    networks:
      - dataforge-net

  # ─── Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: dataforge-nginx
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
    depends_on:
      dataforge:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    networks:
      - dataforge-net

volumes:
  dataforge_data:
    name: dataforge_scraper_data

networks:
  dataforge-net:
    name: dataforge_network
    driver: bridge
