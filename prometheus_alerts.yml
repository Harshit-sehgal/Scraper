# =============================================================================
# DataForge Scraper — Prometheus Alerting Rules
# =============================================================================
# Defines production alerts routed via Alertmanager.
# =============================================================================

groups:
  - name: dataforge_scraper_alerts
    interval: 1m
    rules:
      # 1. API Server Liveness Alert
      - alert: DataForgeAPIInstanceDown
        expr: probe_success{job="blackbox-dataforge-ready"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DataForge API instance is down"
          description: "The unauthenticated readiness probe {{ $labels.instance }} has failed for more than 1 minute."

      # 1b. Metrics Scrape Failure Alert
      - alert: DataForgeMetricsScrapeFailed
        expr: up{job="dataforge"} == 0 and on() probe_success{job="blackbox-dataforge-ready"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DataForge metrics scrape failed while readiness probe succeeds"
          description: "Prometheus cannot scrape /metrics, but /ready is healthy. Check DATAFORGE_METRICS_TOKEN and internal metrics routing before treating this as API downtime."

      # 2. Queue Backlog Alert
      - alert: QueueBacklogHigh
        expr: dataforge_queue_pending > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scraper queue backlog is high"
          description: "Pending queue depth is {{ $value }} (threshold > 100) for more than 5 minutes."

      # 3. High Job Failure Rate Alert
      - alert: HighJobFailureRate
        expr: rate(dataforge_jobs_total{status="failed"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High scraper job failure rate"
          description: "Scraped jobs are failing at a rate of {{ $value }} failures/sec over the last 5 minutes."

      # 4. Database Exceptions Alert
      - alert: DatabaseErrorsDetected
        expr: rate(dataforge_errors_total{type="database"}[1m]) > 0
        for: 0s # Trigger instantly
        labels:
          severity: critical
        annotations:
          summary: "Database connection exceptions detected"
          description: "Postgres database errors are actively occurring at a rate of {{ $value }} errors/sec."

      # 5. API Response Latency Alert
      - alert: HighAPIResponseLatency
        expr: histogram_quantile(0.95, sum(rate(dataforge_request_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API response latency"
          description: "95th percentile response latency is {{ $value }}s (threshold > 2.0s) for more than 5 minutes."

      # 6. Anti-Bot / Captcha Block Rate Alert
      - alert: HighAntiBotBlockRate
        expr: |
          (
            sum(rate(dataforge_anti_bot_classifications_total{classification!="ok"}[5m]))
            /
            (sum(rate(dataforge_anti_bot_classifications_total[5m])) + 1)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High anti-bot challenge rate"
          description: "{{ $value | humanizePercentage }} of scraped pages encountered anti-bot challenges in the last 5 minutes (threshold > 50%)."

      # 7. Browser Launch Failures Alert
      - alert: BrowserLaunchFailures
        expr: rate(dataforge_browser_launch_total{outcome="failure"}[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Browser launch failures detected"
          description: "Playwright browser launches are failing at {{ $value | humanize }} failures/sec over 5 minutes. Check browser binary integrity and system dependencies."

      # 8. Export Generation Failure Rate Alert
      - alert: HighExportFailureRate
        expr: |
          (
            sum(rate(dataforge_export_outcomes_total{outcome="failure"}[10m]))
            /
            (sum(rate(dataforge_export_outcomes_total[10m])) + 1)
          ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High export generation failure rate"
          description: "{{ $value | humanizePercentage }} of export generation attempts failed in the last 10 minutes (threshold > 20%)."

      # 9. SSRF Block Rate Spike Alert
      - alert: HighSSRFBlockRate
        expr: rate(dataforge_ssrf_rejects_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High SSRF reject rate"
          description: "SSRF guard is rejecting {{ $value | humanize }} requests/sec. Possible malicious scanning or misconfigured URLs."

      # 10. CSP Violation Rate Alert — NEW
      - alert: HighCSPViolationRate
        expr: rate(dataforge_csp_violations_total[5m]) > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "CSP violations detected"
          description: "Content-Security-Policy report-only violations are occurring at {{ $value | humanize }} violations/sec. Once the report-only period shows zero violations for a full release cycle, the CSP can be tightened to enforce mode."

      # 11. Repo Query Latency Degradation Alert — NEW
      # F-MON-009: the metric is exposed as a gauge with a ``quantile``
      # label by the app metrics collector (ring buffer median). The
      # ``or on() vector(0)`` clause handles the case where no queries
      # have been recorded yet (empty ring buffer → no series → alert
      # would be absent without the or-clause).
      - alert: RepoQueryLatencyDegraded
        expr: dataforge_repo_query_latency_seconds{quantile="0.95"} > 0.5 or on() vector(0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Repository query latency degraded"
          description: "95th percentile repository query latency is {{ $value }}s (threshold > 0.5s) for more than 10 minutes. Check Postgres connection pool health and query performance."

      # 12. Extraction Method Anomaly Alert — NEW
      - alert: ExtractionMethodAnomaly
        expr: |
          (
            sum(rate(dataforge_extraction_method_total{method="llm"}[30m]))
            /
            (sum(rate(dataforge_extraction_method_total[30m])) + 1)
          ) < 0.05
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "LLM-based extraction rate anomaly"
          description: "LLM-based extraction accounts for less than 5% of extractions over 30 minutes (currently {{ $value | humanizePercentage }}). This may indicate an LLM API outage or configuration issue if LLM extraction was expected to be dominant."

      # 13. Worker Heartbeat Stale Alert — NEW
      # NOTE: `for: 2m` assumes the default heartbeat TTL of 60s (~2 missed beats).
      # If the worker's --heartbeat-ttl is increased significantly, this `for`
      # duration should be adjusted to at least 2× the TTL to avoid false positives.
      - alert: WorkerHeartbeatStale
        expr: dataforge_worker_heartbeat_alive == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Worker heartbeat stale — worker may be dead"
          description: "Worker {{ $labels.worker_id }} (hostname: {{ $labels.hostname }}) has not sent a heartbeat within its TTL for more than 2 minutes. If all workers are affected, check the shared database connection. If an individual worker is affected, check its container/process health."

      # 14. High Rate Limit Block Rate — NEW
      - alert: HighRateLimitBlockRate
        expr: |
          (
            sum(rate(dataforge_rate_limit_global_hits_total[5m]))
            +
            sum(rate(dataforge_rate_limit_per_ip_hits_total[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate limit block rate"
          description: "Rate limiter is blocking {{ $value | humanize }} requests/sec across both global and per-IP tiers for more than 5 minutes (threshold > 0.5 req/s). This may indicate aggressive crawling, a misconfigured RATE_LIMIT_GLOBAL setting, or a traffic spike."

      # 15. Alertmanager Down
      - alert: DataForgeAlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DataForge Alertmanager is down"
          description: "Prometheus cannot scrape Alertmanager for more than 1 minute. Alerts may not deliver until the alertmanager container is restored."

      # 16. PostgreSQL Disk Utilization Alert — F-MON-004
      # Uses pg_database_size_bytes exposed via the postgres-exporter
      # extended queries in postgres-queries.yaml. The custom query
      # dataforge_pg_table_sizes provides total_bytes per table; the
      # alert fires when the dataforge database exceeds 20 GB.
      - alert: PostgresDiskUsageHigh
        expr: |
          (
            sum(dataforge_pg_table_sizes_total_bytes)
            or on() vector(0)
          ) > 21474836480
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres database disk usage is high"
          description: "The total size of the dataforge database tables exceeds 20 GB (currently {{ $value | humanize }} bytes). Check table growth, vacuum health, and whether old job results or audit logs need pruning. F-MON-004."

      # 17. Container OOM Alert — F-MON-004
      # Uses cadvisor metrics to detect when a container's memory usage
      # exceeds 95% of its configured limit. The cadvisor service is
      # deployed via docker-compose.prod.yml and scraped by Prometheus.
      - alert: ContainerOOMKillPending
        expr: |
          (
            container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.95
          )
          and
          (
            container_spec_memory_limit_bytes > 0
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container memory usage exceeds 95% of limit — OOM kill imminent"
          description: "Container {{ $labels.name }} (image {{ $labels.image }}) is using {{ $value | humanizePercentage }} of its memory limit. An OOM kill is likely within minutes. Increase the memory limit in docker-compose.prod.yml or investigate the memory leak. F-MON-004."

      # 18. SSL/TLS Certificate Expiry Alert — F-MON-004
      # Uses probe_ssl_earliest_cert_expiry from the blackbox TLS
      # probe (tls_connect module). Fires when the certificate
      # expires in less than 30 days (2,592,000 seconds).
      - alert: TLSCertificateExpiring
        expr: |
          (
            probe_ssl_earliest_cert_expiry - time() < 2592000
          )
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires in less than 30 days"
          description: "The TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}. Renew the certificate via certbot or your CA before it expires. F-MON-004."

      # 19. Node Exporter Health — F-MON-004
      # Fires when the node-exporter scrape fails, meaning host-level
      # metrics (CPU, memory, disk, network) are no longer being
      # collected. This is an infra observability gap.
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Node exporter is down — host metrics unavailable"
          description: "Prometheus cannot scrape the node-exporter for more than 2 minutes. Host-level metrics (CPU, memory, disk, network) are unavailable. Check the node-exporter container health. F-MON-004."

      # 20. cAdvisor Health — F-MON-004
      # Fires when the cadvisor scrape fails, meaning container-level
      # metrics are no longer being collected. OOM alerts depend on this.
      - alert: CadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "cAdvisor is down — container metrics unavailable"
          description: "Prometheus cannot scrape cAdvisor for more than 2 minutes. Container-level metrics (memory, CPU, I/O per container) are unavailable, so OOM kill prediction is degraded. Check the cadvisor container health. F-MON-004."

      # 21. Host Filesystem Space Filling Up — F-MON-004
      # Uses node-exporter filesystem metrics. Fires when any mounted
      # filesystem is more than 85% full. This catches disk exhaustion
      # before it takes down Postgres, Prometheus, or backups.
      - alert: NodeFilesystemSpaceFillingUp
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|nsfs|overlay"}
            /
            node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|nsfs|overlay"}
          ) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host filesystem is more than 85% full"
          description: "Filesystem {{ $labels.mountpoint }} ({{ $labels.fstype }}) on {{ $labels.instance }} has only {{ $value | humanizePercentage }} space remaining. Investigate large files, old logs, or stale backups. F-MON-004."

      # 22. Public HTTPS Availability — F-MON-004
      # Uses the blackbox TLS probe to detect if the public HTTPS
      # endpoint is unreachable or the TLS handshake fails.
      - alert: PublicHTTPSProbeFailing
        expr: probe_success{job="blackbox-tls"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Public HTTPS endpoint probe is failing"
          description: "The TLS probe to {{ $labels.instance }} has failed for more than 2 minutes. The endpoint may be down, the certificate may be invalid, or the TLS handshake may be broken. F-MON-004."

      # 23. LLM Cascade Failure Rate Alert — NEW
      # Fires when the LLM cascade circuit breaker has tripped (or is
      # close to tripping). The two signals we use:
      #   * ``llm_cascade_consecutive_failures_total`` — running
      #     tally of consecutive cascade exhaustions
      #   * ``llm_cascade_state`` — current breaker state (0=closed,
      #     1=half-open, 2=open)
      # When either signal suggests the breaker is firing repeatedly,
      # operators should investigate provider availability (Groq
      # rate-limits, Pollinations outages, g4f reliability).
      - alert: LLMCascadeRepeatedFailures
        expr: |
          (
            delta(llm_cascade_consecutive_failures_total[5m]) > 3
          )
          or
          (
            llm_cascade_state == 2
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "LLM cascade is failing repeatedly"
          description: "The LLM cascade has failed {{ $value }} times in the last 5 minutes, or the breaker is currently OPEN. LLM-powered scrapers may be silently producing empty structured data. Verify provider availability and check ``get_silent_failure_counts()`` in app.llm_bridge."

      # 24. Silent LLM Empty Response Rate — NEW
      # Even when the breaker stays closed, individual success-low-then
      # silent-empty patterns indicate data-integrity risk. Fires when
      # silent-empty responses exceed 0.1/s over 10 minutes.
      - alert: LLMSilentEmptyResponseElevated
        expr: rate(llm_silent_failure_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM silent-empty-return rate is elevated"
          description: "Silent-empty LLM responses are occurring at {{ $value | humanize }} per second (threshold > 0.1/s). Callers may be persisting empty structured data. Investigate ``get_silent_failure_counts()`` and consider enabling DATAFORGE_LLM_RAISE_ON_FAILURE=true."
