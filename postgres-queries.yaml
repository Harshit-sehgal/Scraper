# =============================================================================
# DataForge — Postgres Exporter Custom Queries
# =============================================================================
# These queries expose application-level Postgres metrics beyond what the
# default pg_stat_* tables provide. Queries are run on each scrape cycle.
# =============================================================================

# ─── Job Queue Metrics ──────────────────────────────────────────────────────
dataforge_queue_metrics:
  query: |
    SELECT
      COUNT(*) FILTER (WHERE status = 'pending') AS pending,
      COUNT(*) FILTER (WHERE status = 'running') AS running,
      COUNT(*) FILTER (WHERE status = 'completed') AS completed,
      COUNT(*) FILTER (WHERE status = 'failed') AS failed,
      COUNT(*) FILTER (WHERE status = 'canceled') AS canceled
    FROM jobs
  metrics:
    - pending:
        usage: "GAUGE"
        description: "Number of pending jobs in Postgres"
    - running:
        usage: "GAUGE"
        description: "Number of currently running jobs"
    - completed:
        usage: "GAUGE"
        description: "Number of completed jobs"
    - failed:
        usage: "GAUGE"
        description: "Number of failed jobs"
    - canceled:
        usage: "GAUGE"
        description: "Number of canceled jobs"

# ─── Connection Pool Metrics ────────────────────────────────────────────────
dataforge_pg_connections:
  query: |
    SELECT
      COUNT(*) FILTER (WHERE state = 'active') AS active,
      COUNT(*) FILTER (WHERE state = 'idle') AS idle,
      COUNT(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_transaction,
      COUNT(*) FILTER (WHERE wait_event_type IS NOT NULL) AS waiting,
      COUNT(*) FILTER (WHERE backend_type = 'client backend' AND state = 'active') AS client_active
    FROM pg_stat_activity
    WHERE datname = 'dataforge'
  metrics:
    - active:
        usage: "GAUGE"
        description: "Number of active connections to dataforge database"
    - idle:
        usage: "GAUGE"
        description: "Number of idle connections to dataforge database"
    - idle_in_transaction:
        usage: "GAUGE"
        description: "Number of connections idle in transaction"
    - waiting:
        usage: "GAUGE"
        description: "Number of connections waiting on a lock"
    - client_active:
        usage: "GAUGE"
        description: "Number of client backend connections that are active"

# ─── Table Size Metrics ────────────────────────────────────────────────────
dataforge_pg_table_sizes:
  query: |
    SELECT
      relname AS table_name,
      pg_total_relation_size(relid) AS total_bytes,
      pg_relation_size(relid) AS table_bytes,
      pg_indexes_size(relid) AS index_bytes,
      n_live_tup AS live_rows,
      n_dead_tup AS dead_rows,
      ROUND(100.0 * n_dead_tup / NULLIF(n_live_tup + n_dead_tup, 0), 2) AS dead_ratio
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
    ORDER BY pg_total_relation_size(relid) DESC
    LIMIT 20
  metrics:
    - total_bytes:
        usage: "GAUGE"
        description: "Total size of table including indexes (bytes)"
    - table_bytes:
        usage: "GAUGE"
        description: "Size of table data (bytes)"
    - index_bytes:
        usage: "GAUGE"
        description: "Size of indexes (bytes)"
    - live_rows:
        usage: "GAUGE"
        description: "Estimated number of live rows"
    - dead_rows:
        usage: "GAUGE"
        description: "Estimated number of dead rows"
    - dead_ratio:
        usage: "GAUGE"
        description: "Percentage of dead rows (VACUUM health indicator)"

# ─── Replication / WAL Metrics ─────────────────────────────────────────────
dataforge_pg_replication:
  query: |
    SELECT
      COUNT(*) FILTER (WHERE state = 'streaming') AS streaming_replicas,
      COUNT(*) FILTER (WHERE state = 'catchup') AS catching_up_replicas
    FROM pg_stat_replication
  metrics:
    - streaming_replicas:
        usage: "GAUGE"
        description: "Number of streaming replicas"
    - catching_up_replicas:
        usage: "GAUGE"
        description: "Number of replicas catching up"

# ─── VACUUM / Autovacuum Health ────────────────────────────────────────────
dataforge_pg_vacuum_progress:
  query: |
    SELECT
      COUNT(*) AS tables_needing_vacuum
    FROM pg_stat_user_tables
    WHERE schemaname = 'public'
      AND n_dead_tup > 1000
      AND (last_autovacuum IS NULL OR last_autovacuum < NOW() - INTERVAL '1 day')
  metrics:
    - tables_needing_vacuum:
        usage: "GAUGE"
        description: "Number of tables with >1000 dead rows and no autovacuum in 24h"
