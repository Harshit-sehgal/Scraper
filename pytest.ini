[pytest]
testpaths = backend/tests backend/benchmarks
python_files = test_*.py
asyncio_default_fixture_loop_scope = module
addopts = -q
markers =
    integration: marks tests as integration/optional (live API calls). Skipped by default.
    postgres: tests that require a running Postgres instance (via testcontainers). Skipped by default.
# Coverage: pip install pytest-cov and append:
#   --cov=backend/app --cov-report=term-missing --cov-fail-under=70
