# =============================================================================
# DataForge Scraper — Local Testing Override for Production Stack
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.override.local.yml up -d
#
# This override:
#   - Uses an HTTP-only nginx config (no TLS required for local testing)
#   - Uses caller-provided DATAFORGE_DB_PASSWORD / GRAFANA_PASSWORD /
#     ALERTMANAGER_SLACK_WEBHOOK_URL values instead of committed secrets
#   - Disables worker queue (no postgres queue needed for testing)
#=============================================================================

services:
  dataforge:
    environment:
      # Production mode with a caller-provided database password.
      # Export DATAFORGE_DB_PASSWORD before starting the local override.
      - DATAFORGE_ENV=production
      - DATAFORGE_STORAGE_BACKEND=postgres
      - DATAFORGE_PG_DRIVER=psycopg3
      - DATAFORGE_DATABASE_URL=postgresql://dataforge:${DATAFORGE_DB_PASSWORD:?DATAFORGE_DB_PASSWORD is required}@postgres:5432/dataforge
      - DATAFORGE_WORKER_QUEUE=true
      - DATAFORGE_QUEUE_BACKEND=postgres
      # Skip the postgres connectivity check in the env validator (postgres
      # may not be ready yet when the check runs, and we already validated
      # the URL is correct)
      - DATAFORGE_SKIP_DB_CHECK=true

  worker:
    environment:
      # Match the dataforge service settings for production mode
      - DATAFORGE_ENV=production
      - DATAFORGE_STORAGE_BACKEND=postgres
      - DATAFORGE_PG_DRIVER=psycopg3
      - DATAFORGE_DATABASE_URL=postgresql://dataforge:${DATAFORGE_DB_PASSWORD:?DATAFORGE_DB_PASSWORD is required}@postgres:5432/dataforge
      - DATAFORGE_WORKER_QUEUE=true
      - DATAFORGE_QUEUE_BACKEND=postgres
      - DATAFORGE_SKIP_DB_CHECK=true
      - DATAFORGE_WORKER=true

  # ─── Grafana ────────────────────────────────────────────────────────────
  # Docker secrets mounted at /run/secrets/ are root-owned with mode 0400.
  # Grafana's container runs as UID 472 (grafana user), so it can't read
  # the secret file. For local testing, set the password from the caller's
  # GRAFANA_PASSWORD variable instead of committing a literal password.
  grafana:
    environment:
      # Override to use plain env var instead of __FILE secret
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      # Unset the __FILE variant so Grafana doesn't try to read the secret
      # file (which would fail with Permission denied and crash the container)
      - GF_SECURITY_ADMIN_PASSWORD__FILE=

  # ─── Alertmanager ───────────────────────────────────────────────────────
  # The alertmanager.yml template expects SMTP host and Slack webhook to be
  # set via envsubst. Alertmanager v0.27+ rejects empty webhook URLs, so
  # local production-stack tests must provide ALERTMANAGER_SLACK_WEBHOOK_URL
  # from the caller's environment instead of using a committed dummy URL.
  alertmanager:
    environment:
      - ALERTMANAGER_SMTP_HOST=localhost:25
      - ALERTMANAGER_SMTP_USER=
      - ALERTMANAGER_SMTP_PASS=
      - ALERTMANAGER_EMAIL_FROM=alertmanager@localhost
      - ALERTMANAGER_EMAIL_TO=ops@localhost
      - ALERTMANAGER_SLACK_WEBHOOK_URL=${ALERTMANAGER_SLACK_WEBHOOK_URL:?ALERTMANAGER_SLACK_WEBHOOK_URL is required}
    # Override the entrypoint to substitute env vars correctly.
    # NOTE: Use $$ to escape compose variable substitution — $VAR in compose
    # files is a COMPOSE variable (from .env), not a shell variable.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|__ALERTMANAGER_SLACK_WEBHOOK_URL__|$${ALERTMANAGER_SLACK_WEBHOOK_URL}|g" \
            -e "s|__ALERTMANAGER_SMTP_HOST__|$${ALERTMANAGER_SMTP_HOST:-localhost:25}|g" \
            -e "s|__ALERTMANAGER_SMTP_USER__|$${ALERTMANAGER_SMTP_USER:-}|g" \
            -e "s|__ALERTMANAGER_SMTP_PASS__|$${ALERTMANAGER_SMTP_PASS:-}|g" \
            -e "s|__ALERTMANAGER_EMAIL_FROM__|$${ALERTMANAGER_EMAIL_FROM:-alertmanager@localhost}|g" \
            -e "s|__ALERTMANAGER_EMAIL_TO__|$${ALERTMANAGER_EMAIL_TO:-ops@localhost}|g" \
          < /etc/alertmanager/alertmanager.yml.template \
          > /tmp/alertmanager.yml
        # Grep gate mirrors docker-compose.prod.yml exactly — any new
        # ``__ALERTMANAGER_*__`` placeholder must be added to BOTH
        # files in the same change so the substitution never silently
        # leaks an unreplaced token. F-DOCKER-008.
        if grep -q '__ALERTMANAGER_SLACK_WEBHOOK_URL__\|__ALERTMANAGER_SMTP_HOST__\|__ALERTMANAGER_SMTP_USER__\|__ALERTMANAGER_SMTP_PASS__\|__ALERTMANAGER_EMAIL_FROM__\|__ALERTMANAGER_EMAIL_TO__' /tmp/alertmanager.yml; then
          echo 'ERROR: alertmanager template substitution failed' >&2
          exit 1
        fi
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=$${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093} \
          --cluster.listen-address=

  # ─── Postgres Exporter ──────────────────────────────────────────────────
  # The postgres-exporter service uses secrets (PG_USER_FILE / PG_PASSWORD_FILE)
  # which are root-owned and can't be read by the exporter's user. For local
  # testing, set DATA_SOURCE_NAME directly via env var instead. Also clear
  # all PG_* env vars so the exporter uses only DATA_SOURCE_NAME.
  postgres-exporter:
    environment:
      # Use direct DSN instead of secret-file-based PG_USER_FILE/PG_PASSWORD_FILE
      - DATA_SOURCE_NAME=postgresql://dataforge:${DATAFORGE_DB_PASSWORD:?DATAFORGE_DB_PASSWORD is required}@postgres:5432/dataforge?sslmode=disable
      # Clear all PG_* env vars so the exporter doesn't try to build a DSN from them
      - PG_USER_FILE=
      - PG_PASSWORD_FILE=
      - PG_HOST=
      - PG_PORT=
      - PG_DB=
      - PG_SSLMODE=
    # Remove secret mounts since we're using direct env vars
    secrets: []

  nginx:
    volumes:
      # Replace the default nginx config with an HTTP-only version for local testing
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
