# =============================================================================
# DataForge Scraper — nginx Reverse Proxy (HTTP-only, for local testing)
# =============================================================================
# Use this config with docker-compose.override.local.yml when running
# docker compose -f docker-compose.prod.yml -f docker-compose.override.local.yml
#
# This is an HTTP-only variant of the production nginx.conf — no TLS, no
# HTTPS redirect. Suitable for local testing and development environments
# that cannot obtain a certificate.
# =============================================================================

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ─── Basic Settings ────────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 5m;
    server_tokens off;

    # ─── Docker DNS Resolver ───────────────────────────────────────────────
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─── MIME Types ────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ─── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # ─── Rate Limiting Zones ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # ─── Upstream ──────────────────────────────────────────────────────────
    upstream dataforge_api {
        zone dataforge_api 64k;
        server dataforge:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ─── Server Block — HTTP-only ──────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        absolute_redirect off;

        # ─── Security Headers ──────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; form-action 'self'" always;

        # ─── Root Health Check ─────────────────────────────────────────────
        location = /health {
            proxy_pass http://dataforge_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            break;
        }

        location = /ready {
            proxy_pass http://dataforge_api/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            break;
        }

        # ─── API Proxy ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://dataforge_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }

        # ─── FastAPI Docs & Metrics (blocked at proxy level) ───────────────
        location /docs       { return 404; }
        location /redoc      { return 404; }
        location /openapi.json { return 404; }
        location /metrics    { return 404; }

        # ─── Frontend Static Assets (served directly by nginx) ─────────────

        # ─── Landing page static assets (root-level paths) ────────────────
        location /styles.css {
            root /usr/share/nginx/html/frontend;
            expires 1h;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
        location /favicon.svg {
            root /usr/share/nginx/html/frontend;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ─── SPA static assets ────────────────────────────────────────────
        # These alias blocks handle the specific assets referenced by index.html.
        # The generic /app/ block below handles everything else via alias.
        location /app/styles.css {
            alias /usr/share/nginx/html/frontend/styles.css;
            expires 1h;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
        location /app/app.js {
            alias /usr/share/nginx/html/frontend/app.js;
            expires 1h;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
        location /app/favicon.svg {
            alias /usr/share/nginx/html/frontend/favicon.svg;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ─── SPA JS modules (imported dynamically by app.js) ───────────────────
        location /app/js/ {
            alias /usr/share/nginx/html/frontend/js/;
            expires 1h;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }

        # ─── SPA CSS modules (imported by styles.css via @import) ─────────────
        location /app/styles/ {
            alias /usr/share/nginx/html/frontend/styles/;
            expires 1h;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }

        # ─── SPA catch-all (alias strips /app/ prefix for correct path resolution) ─
        # Using alias instead of root so that the /app/ prefix is stripped from the
        # URI before mapping to the filesystem. This means /app/js/api.js maps to
        # /usr/share/nginx/html/frontend/js/api.js (correct) instead of
        # /usr/share/nginx/html/frontend/app/js/api.js (wrong).
        location /app/ {
            alias /usr/share/nginx/html/frontend/;
            try_files $uri $uri/ /index.html =404;
        }
        location = /app { return 302 /app/; }

        # SPA fallback: catch internal redirect from try_files for /index.html
        location = /index.html {
            root /usr/share/nginx/html/frontend;
        }

        location /dashboard/ {
            # F-NGINX-003: nginx normalises `..` segments before the
            # upstream sees the URL, so `/dashboard/../api/admin/foo`
            # would otherwise bypass the ``/api/`` rate-limit and reach
            # FastAPI at unbounded rate. Apply the same ``limit_req``
            # here as on ``/api/`` so the throttle holds regardless of
            # the client-side path prefix.
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://dataforge_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /dashboard { return 302 /dashboard/; }

        # ─── Smoke test page ───────────────────────────────────────────────
        location /smoke/ {
            alias /usr/share/nginx/html/frontend/smoke/;
        }

        # ─── Landing page ───
        location = / {
            alias /usr/share/nginx/html/frontend/landing/;
            try_files $uri $uri/index.html =404;
        }
        location /landing/ {
            alias /usr/share/nginx/html/frontend/landing/;

            # Block operator-filesystem paths served by the same alias.
            # F-DOCKER-006 — see nginx.conf for the production-side
            # equivalent. ``return 404`` avoids leaking directory
            # existence to an attacker probing for ``.git/``.
            location ~ /\.(git|env|docker|aws) {
                deny all;
                return 404;
            }
        }
        location /js/ {
            alias /usr/share/nginx/html/frontend/js/;
        }

        location / { return 404; }
    }
}
