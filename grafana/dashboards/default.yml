# =============================================================================
# DataForge — Grafana Dashboard Provisioning
# =============================================================================
# Automatically loads dashboards from the provisioning directory.
# =============================================================================

apiVersion: 1

providers:
  - name: 'DataForge Dashboards'
    orgId: 1
    folder: 'DataForge'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
