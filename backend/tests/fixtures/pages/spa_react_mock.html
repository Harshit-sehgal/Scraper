<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hydration Demo — Acme Widgets SPA (rendered)</title>
</head>
<body>
<div id="hydration-root">
  <p class="boot-fallback" id="server-fallback">Loading…</p>
  <div class="hydrated-list" data-hydration-source="post-mount" data-hydration-time="32ms">
    <article class="hydrated-item" data-product-id="p-001">
      <h3 class="hydrated-title">Pioneer Air Purifier</h3>
      <span class="hydrated-price">$129.00</span>
      <span class="hydrated-category">Air Quality</span>
    </article>
    <article class="hydrated-item" data-product-id="p-002">
      <h3 class="hydrated-title">Aurora Smart Lamp</h3>
      <span class="hydrated-price">$42.50</span>
      <span class="hydrated-category">Lighting</span>
    </article>
    <article class="hydrated-item" data-product-id="p-003">
      <h3 class="hydrated-title">Helix Standing Desk</h3>
      <span class="hydrated-price">$449.00</span>
      <span class="hydrated-category">Furniture</span>
    </article>
    <article class="hydrated-item" data-product-id="p-004">
      <h3 class="hydrated-title">Mariner Robot Vacuum</h3>
      <span class="hydrated-price">$299.99</span>
      <span class="hydrated-category">Cleaning</span>
    </article>
    <article class="hydrated-item" data-product-id="p-005">
      <h3 class="hydrated-title">Sentinel Doorbell Camera</h3>
      <span class="hydrated-price">$89.00</span>
      <span class="hydrated-category">Security</span>
    </article>
  </div>
</div>

<noscript>This page requires JavaScript enabled to render the catalog.</noscript>

<!--
  In production, the SPA mount happens when Playwright waits for #hydration-root
  to populate (networkidle + presence check). This fixture captures the
  post-hydration DOM after the runtime has flushed content into the page.
  The script below is preserved for documentation only — the regex extractor
  observes the DOM above, which mirrors what Playwright would see after
  wait_until="networkidle" resolves.
-->
<script type="module">
  // This stale script intentionally left in place to model the realistic
  // SPA output: the catalog data is baked into the DOM as static markup
  // rather than fetched, because the regex extractor runs on server HTML.
  window.__HYDRATED__ = true;
</script>
</body>
</html>
