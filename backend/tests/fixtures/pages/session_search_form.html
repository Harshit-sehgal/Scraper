<!DOCTYPE html>
<html lang="en">
<head>
<title>Start a New Search — Acme Components</title>
<meta charset="utf-8">
</head>
<body>
<div class="session-replay-page" data-session-state="expired">
  <div class="replay-warning">
    <h1>Search Session Expired</h1>
    <p>Your previous search could not be replayed. Please re-enter your query to start a new session.</p>
  </div>

  <div class="search-form-container">
    <form action="/search" method="GET" class="search-form">
      <label for="query">Search parts:</label>
      <input type="text" id="query" name="q" placeholder="e.g. industrial valve kit" required />
      <input type="hidden" name="sid" value="needs-replay" />
      <button type="submit">Start new search</button>
    </form>
  </div>

  <aside class="recent-searches">
    <h2>Your recent searches</h2>
    <ul>
      <li>hydraulic pump</li>
      <li>copper fittings</li>
      <li>pressure gauge</li>
    </ul>
    <p class="aside-note">Recent searches cannot be replayed.</p>
  </aside>
</div>
</body>
</html>
