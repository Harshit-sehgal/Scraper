<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Pricing Table Fixture</title>
  </head>
  <body>
    <h1>Wholesale Pricing</h1>
    <table id="pricing-table">
      <thead>
        <tr>
          <th>SKU</th>
          <th>Name</th>
          <th>Unit price</th>
          <th>Minimum order</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>SKU-1</td>
          <td>Brass Fitting</td>
          <td>$4.20</td>
          <td>50</td>
        </tr>
        <tr>
          <td>SKU-2</td>
          <td>Steel Clamp</td>
          <td>$2.85</td>
          <td>100</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
