<!DOCTYPE html>
<html>
<head><title>Flight Search Results</title></head>
<body>
    <div id="app-root">
        <header>Navigation and Ads</header>
        <main>
            <div class="search-summary">Flights to London</div>
            <div class="results-list">
                <!-- Record 1 -->
                <div class="flight-card" data-id="FL123">
                    <div class="airline-info">
                        <img src="logo1.png" alt="British Airways">
                        <span class="name">British Airways</span>
                    </div>
                    <div class="times">
                        <div class="dep">10:00 AM - LHR</div>
                        <div class="arr">12:30 PM - CDG</div>
                    </div>
                    <div class="price-section">
                        <span class="currency">£</span>
                        <span class="amount">245.50</span>
                        <button class="book-btn">Select</button>
                    </div>
                </div>
                <!-- Record 2 -->
                <div class="flight-card" data-id="FL456">
                    <div class="airline-info">
                        <img src="logo2.png" alt="Air France">
                        <span class="name">Air France</span>
                    </div>
                    <div class="times">
                        <div class="dep">11:15 AM - LHR</div>
                        <div class="arr">01:45 PM - CDG</div>
                    </div>
                    <div class="price-section">
                        <span class="currency">£</span>
                        <span class="amount">199.00</span>
                        <button class="book-btn">Select</button>
                    </div>
                </div>
            </div>
        </main>
        <footer>Messy Footer with links and copyright 2026</footer>
    </div>
</body>
</html>
