# Dependabot keeps the lockfiles fresh.
# Both pip and npm are checked weekly on a rebase-only schedule so
# dependabot PRs don't collide with in-flight work. Group-level
# settings are used for pip (all Python deps in one PR) and npm is
# open per-package because the tree is small.
#
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    # Group all pip dependency bumps into a single PR to reduce noise.
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Rebase the branch on every new commit to main; no open/close cycle.
    rebase-strategy: "rebase"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Kolkata"
    # npm ecosystem does not support groups natively — each dep gets
    # its own PR, which is fine given the small devDependency set.
    rebase-strategy: "rebase"

  # F-CI-003 keep third-party GitHub Actions SHA-pinned. The workflow
  # files pin actions by their 40-char SHA, so a tag push by the
  # upstream action maintainer cannot silently swap the contents
  # that CI runs. Dependabot refreshes the SHAs whenever a new tag
  # is published. Patch and minor bumps of those SHAs go through
  # `dependabot-auto-merge.yml` (F-CI-001 / F-CI-002).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Kolkata"
    groups:
      github-actions-pins:
        patterns:
          - "*"
    rebase-strategy: "rebase"
