name: Browser E2E Tests (Playwright)

on:
  schedule:
    # Weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch: # Allows manual trigger

# Cancel in-flight runs on the same ref when a new run is triggered,
# so a stale manual dispatch does not double-spend CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-browser-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Playwright Chromium browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browser-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium (cached)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps only (browser cached)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run Backend Browser E2E tests
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m pytest -v backend/tests --run-browser -o addopts= \
          --tb=short --reruns 3 --reruns-delay 10

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-e2e-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies (Playwright test runner)
        run: npm ci

      - name: Run Frontend E2E (Playwright smoke tests)
        run: |
          # Start the FastAPI dev server in the background
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level warning &>/tmp/server-e2e.log &
          SERVER_PID=$!

          # Wait for the server to be ready (max 15s)
          READY=false
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ 2>/dev/null || echo "000")
            if [ "$CODE" != "000" ]; then
              echo "Server ready (HTTP $CODE)"
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" = false ]; then
            echo "Server failed to start within 15s"
            cat /tmp/server-e2e.log 2>/dev/null || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Run the frontend Playwright smoke tests
          npx playwright test --config frontend/playwright.config.mjs --reporter=list 2>&1
          E2E_EXIT=$?

          # Clean up
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          if [ $E2E_EXIT -ne 0 ]; then
            echo "❌ Frontend E2E tests failed"
            exit $E2E_EXIT
          fi
          echo "✅ Frontend E2E tests passed"

  notify:
    name: Telegram Notification
    needs: [browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always()
    steps:
      - name: Send Telegram Message
        if: env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        uses: appleboy/telegram-action@37056891d444f558225b59f0d26b4b05c5e9828b
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔔 Browser E2E Tests Status: ${{ needs.browser-e2e.result == 'success' && '✅ Passed' || '❌ Failed' }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            Author: ${{ github.actor }}
