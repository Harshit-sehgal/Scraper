name: Golden Dataset Live Tests

on:
  schedule:
    # Weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual trigger

jobs:
  golden-dataset:
    name: Golden Dataset Live Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-golden-${{ hashFiles('backend/requirements-dev.lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.lock.txt

      - name: Install Playwright Chromium with system deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Golden Dataset tests
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m pytest -v backend/tests/test_golden_dataset.py --run-golden-dataset -o addopts= \
          --tb=short --reruns 3 --reruns-delay 10

  notify:
    name: Telegram Notification
    needs: [golden-dataset]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@37056891d444f558225b59f0d26b4b05c5e9828b
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔔 Golden Dataset Live Tests Status: ${{ needs.golden-dataset.result == 'success' && '✅ Passed' || '❌ Failed' }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            Author: ${{ github.actor }}
