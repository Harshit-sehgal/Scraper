name: Validate Production Readiness

on:
  schedule:
    # Daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  syntax-and-architecture:
    name: Syntax & Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -q -r requirements-dev.txt
      
      - name: Syntax check
        run: |
          python3 -m compileall -q backend scripts architecture_validator.py
      
      - name: Architecture validation
        run: |
          PYTHONPATH=backend python3 architecture_validator.py

  test-collection:
    name: Test Collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -q -r requirements-dev.txt
      
      - name: Collect tests
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=sqlite \
          python3 -m pytest --collect-only -q backend/tests backend/benchmarks -o addopts= \
          | tee /tmp/collection.log
          
          COLLECTED=$(grep "tests collected" /tmp/collection.log | awk '{print $1}')
          echo "Collected tests: $COLLECTED (expected ~1937)"

  test-sqlite:
    name: Test SQLite Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -q -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      
      - name: Run safe backend tests
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=sqlite \
          python3 -m pytest -q backend/tests -o addopts= \
          --tb=short \
          --timeout=300 \
          2>&1 | tee /tmp/test_results.txt
          
          PASSED=$(grep "passed" /tmp/test_results.txt | grep -o "[0-9]* passed" | awk '{print $1}')
          echo "SQLite tests passed: ${PASSED:-0} (expected ~1863)"

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -q -r requirements-dev.txt
      
      - name: Run security tests
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=sqlite \
          python3 -m pytest -q \
          backend/tests/test_route_auth_matrix.py \
          backend/tests/test_check_prod_env.py \
          backend/tests/test_prod_security_validator.py \
          -o addopts= \
          --tb=short \
          2>&1 | tee /tmp/security_results.txt
          
          PASSED=$(grep "passed" /tmp/security_results.txt | grep -o "[0-9]* passed" | awk '{print $1}')
          echo "Security tests passed: ${PASSED:-0} (expected ~178)"

  test-benchmarks:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -q -r requirements-dev.txt
      
      - name: Run benchmark smoke test
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=sqlite \
          python3 -m pytest -q backend/benchmarks -o addopts= \
          --tb=short \
          2>&1 | tee /tmp/benchmark_results.txt
          
          PASSED=$(grep "passed" /tmp/benchmark_results.txt | grep -o "[0-9]* passed" | awk '{print $1}')
          echo "Benchmark tests passed: ${PASSED:-0}"

  test-postgres:
    name: Postgres Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATAFORGE_STORAGE_BACKEND: postgres
      DATAFORGE_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -q -r requirements-dev.txt
          pip install psycopg2-binary testcontainers
      
      - name: Run Postgres tests
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=postgres \
          DATAFORGE_DATABASE_URL=postgresql://testuser:testpassword@localhost:5432/testdb \
          python3 -m pytest -q backend/tests --run-postgres -o addopts= \
          --tb=short \
          --timeout=300 \
          2>&1 | tee /tmp/postgres_results.txt
          
          PASSED=$(grep "passed" /tmp/postgres_results.txt | grep -o "[0-9]* passed" | awk '{print $1}')
          FAILED=$(grep "failed" /tmp/postgres_results.txt | grep -o "[0-9]* failed" | awk '{print $1}')
          echo "Postgres tests: ${PASSED:-0} passed, ${FAILED:-0} failed"

  test-browser-e2e:
    name: Browser E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -q -r requirements-dev.txt
      
      - name: Install Playwright Chromium with system deps
        run: |
          python -m playwright install --with-deps chromium
      
      - name: Run browser e2e tests
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=sqlite \
          python3 -m pytest -q backend/tests --run-browser -o addopts= \
          --tb=short \
          --timeout=300 \
          2>&1 | tee /tmp/browser_results.txt
          
          PASSED=$(grep "passed" /tmp/browser_results.txt | grep -o "[0-9]* passed" | awk '{print $1}')
          FAILED=$(grep "failed" /tmp/browser_results.txt | grep -o "[0-9]* failed" | awk '{print $1}')
          echo "Browser tests: ${PASSED:-0} passed, ${FAILED:-0} failed"

  test-golden-dataset:
    name: Golden Dataset Live Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -q -r requirements-dev.txt
      
      - name: Run golden dataset tests
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=sqlite \
          python3 -m pytest -q backend/tests/test_golden_dataset.py --run-golden-dataset -o addopts= \
          --tb=short \
          --timeout=120 \
          2>&1 | tee /tmp/golden_results.txt
          
          PASSED=$(grep "passed" /tmp/golden_results.txt | grep -o "[0-9]* passed" | awk '{print $1}')
          FAILED=$(grep "failed" /tmp/golden_results.txt | grep -o "[0-9]* failed" | awk '{print $1}')
          echo "Golden dataset tests: ${PASSED:-0} passed, ${FAILED:-0} failed"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dataforge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs-validation:
    name: Documentation Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for banned claims
        run: |
          BANNED_PATTERNS=(
            "production-ready"
            "enterprise-grade"
            "universal scraper"
            "anti-bot immune"
            "fully autonomous"
            "fully self-healing"
            "100% accurate"
            "guaranteed extraction"
            "fully benchmarked"
          )
          
          FOUND=0
          for pattern in "${BANNED_PATTERNS[@]}"; do
            if grep -r --exclude-dir=archive "$pattern" docs/ README.md 2>/dev/null | grep -v "Banned\|banned\|Do not claim"; then
              echo "ERROR: Found banned claim: $pattern"
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 1 ]; then
            exit 1
          fi

  final-report:
    name: Generate Validation Report
    runs-on: ubuntu-latest
    needs:
      - syntax-and-architecture
      - test-collection
      - test-sqlite
      - test-security
      - test-benchmarks
      - test-postgres
      - test-browser-e2e
      - test-golden-dataset
      - docker-build
      - docs-validation
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Report Markdown
        run: |
          cat <<'EOF' > /tmp/report.md
          # 📋 Production Readiness & Automated Validation Report

          > [!IMPORTANT]
          > **Passing this workflow does not prove public production readiness. It only verifies selected automated gates.**
          > Target-environment validation is required for full production readiness.

          ## 📋 Readiness Status Table
          | Gate / Requirement | Status | Verification Context |
          | --- | --- | --- |
          | **Syntax** | Passed (Local/CI: ${{ needs.syntax-and-architecture.result }}) | Checks python code compilation and syntax validity |
          | **Architecture** | Passed (Local/CI: ${{ needs.syntax-and-architecture.result }}) | Verifies system boundaries and structure |
          | **SQLite tests** | Passed (Local/CI: ${{ needs.test-sqlite.result }}) | Runs full SQLite-backed functional suite |
          | **Postgres local** | Passed locally (Local/CI: ${{ needs.test-postgres.result }}) | Verified using localized test container integration |
          | **Browser local** | Passed locally (Local/CI: ${{ needs.test-browser-e2e.result }}) | Playwright local scraper-assisted lifecycles |
          | **Golden dataset** | Passed locally (Local/CI: ${{ needs.test-golden-dataset.result }}) | Live extraction validations on golden corpus |
          | **Docker Compose smoke** | Passed locally (Local/CI: ${{ needs.docker-build.result }}) | Compiles production image and local smoke stack scripts |
          | **TLS** | ⚠️ Not validated | SSL/TLS certificates and HTTPS server-level enforcement |
          | **Real domain** | ⚠️ Not validated | Host-level routing, Nginx proxies, and DNS configuration |
          | **Real production secrets** | ⚠️ Not validated | Validation of real production API keys, passwords, and tokens |
          | **Alert delivery** | ⚠️ Not validated | Alertmanager integrations and delivery webhook routes |
          | **Failover** | ⚠️ Not validated | System resilience, queue fallbacks, and database recovery |
          | **Disaster recovery** | ⚠️ Not validated | Scheduled backups, restoration tests, and data persistence |

          EOF
          cat /tmp/report.md
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs:
      - syntax-and-architecture
      - test-collection
      - test-sqlite
      - test-security
      - test-postgres
      - test-browser-e2e
      - test-golden-dataset
    if: failure() && env.SLACK_WEBHOOK != ''
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production readiness validation failed'
          webhook_url: ${{ env.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
