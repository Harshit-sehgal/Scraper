name: Pre-commit Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ruff:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.6.9

      - name: Run Ruff lint
        run: ruff check backend/app backend/tests backend/benchmarks

      - name: Check Ruff formatting
        run: ruff format --check backend/app backend/tests backend/benchmarks

  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install mypy types-beautifulsoup4 types-openpyxl types-requests types-html5lib types-webencodings
          pip install -r backend/requirements-dev.txt

      - name: Run mypy
        run: python -m mypy backend/app --ignore-missing-imports
