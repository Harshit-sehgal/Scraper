name: Pre-commit Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ruff:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.15.0

      - name: Run Ruff lint
        run: ruff check backend/app backend/tests backend/benchmarks scripts

      - name: Check Ruff formatting
        run: ruff format --check backend/app backend/tests backend/benchmarks scripts

  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install mypy types-beautifulsoup4 types-openpyxl types-requests types-html5lib types-webencodings
          pip install -r backend/requirements-dev.txt

      - name: Run mypy
        run: python -m mypy backend/app --ignore-missing-imports

  boundary:
    name: Research-Shell Boundary Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run boundary check
        run: PYTHONPATH=backend python scripts/check_research_boundary.py

  deps-bounds:
    name: Dependency Bounds Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dependency bounds
        run: python scripts/validate_dependency_bounds.py

  notify:
    name: Slack Notification
    needs: [ruff, mypy, boundary, deps-bounds]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "Pre-commit Checks Status"
          SLACK_MESSAGE: |
            *Repo*: ${{ github.repository }}
            *Commit*: <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
            *Branch*: ${{ github.ref_name }}
            *Author*: ${{ github.actor }}
            *Status*: ${{ (needs.ruff.result == 'success' && needs.mypy.result == 'success' && needs.boundary.result == 'success' && needs.deps-bounds.result == 'success') && '✅ Passed' || '❌ Failed' }}
          SLACK_COLOR: ${{ (needs.ruff.result == 'success' && needs.mypy.result == 'success' && needs.boundary.result == 'success' && needs.deps-bounds.result == 'success') && 'good' || 'danger' }}
