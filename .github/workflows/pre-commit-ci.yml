name: Pre-commit Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs on the same ref so a follow-up push does not
# queue behind the prior run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.lock.txt

      - name: Run Ruff lint
        run: ruff check backend/app backend/tests backend/benchmarks scripts

      - name: Check Ruff formatting
        run: ruff format --check backend/app backend/tests backend/benchmarks scripts

  mypy:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install mypy types-beautifulsoup4 types-openpyxl types-requests types-html5lib types-webencodings
          pip install -r backend/requirements-dev.lock.txt

      - name: Run mypy
        run: python -m mypy backend/app --ignore-missing-imports

  boundary:
    name: Research-Shell Boundary Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.lock.txt

      - name: Run boundary check
        run: PYTHONPATH=backend python scripts/check_research_boundary.py

  deps-bounds:
    name: Dependency Bounds Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dependency bounds
        run: python scripts/validate_dependency_bounds.py

  notify:
    name: Telegram Notification
    needs: [ruff, mypy, boundary, deps-bounds]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@37056891d444f558225b59f0d26b4b05c5e9828b  # master @ 2026-04-08
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔔 Pre-commit Checks Status: ${{ (needs.ruff.result == 'success' && needs.mypy.result == 'success' && needs.boundary.result == 'success' && needs.deps-bounds.result == 'success') && '✅ Passed' || '❌ Failed' }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            Author: ${{ github.actor }}
