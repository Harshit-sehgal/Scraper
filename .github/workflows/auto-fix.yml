# =============================================================================
# DataForge Scraper — Auto-Fix Formatting
# =============================================================================
# Automatically fixes formatting issues (Prettier, Ruff) on PR branches
# when the main CI pipeline reports a formatting failure.
#
# This keeps the lint gates green without requiring manual fix-up commits
# from contributors. The bot commits directly to the PR branch using the
# default `github-actions[bot]` identity.
#
# Triggers:
#   - On PR comment "/format" — manually request a format fix
#   - On label "auto-format" applied — automatically format the PR
# =============================================================================

name: Auto-Fix Formatting

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

# Use a dedicated token so the resulting push triggers CI checks on the PR
# branch. The default GITHUB_TOKEN is intentionally read-only here.
# Access: Settings -> Developer settings -> Personal access tokens -> Fine-grained tokens
# Permissions: "Contents: write", "Pull requests: read/write"
# Store as: FORMAT_FIX_BOT_TOKEN
env:
  GH_TOKEN: ${{ secrets.FORMAT_FIX_BOT_TOKEN }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  format-fix:
    name: Format Fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/format')) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'auto-format' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Get PR branch ref
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_URL="${{ github.event.issue.pull_request.url }}"
            PR_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$PR_URL")
            HEAD_REF=$(echo "$PR_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['ref'])")
            HEAD_SHA=$(echo "$PR_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['sha'])")
            HEAD_REPO=$(echo "$PR_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['repo']['full_name'])")
          else
            HEAD_REF="${{ github.head_ref }}"
            HEAD_SHA="${{ github.sha }}"
            HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          fi

          echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "repo=$HEAD_REPO" >> "$GITHUB_OUTPUT"
          if [ "$HEAD_REPO" = "${{ github.repository }}" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip fork PR branch
        if: steps.pr.outputs.allowed != 'true'
        run: echo "Auto-fix skipped because PR head repo is ${{ steps.pr.outputs.repo }}."

      - name: Require format-fix token
        if: steps.pr.outputs.allowed == 'true'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::FORMAT_FIX_BOT_TOKEN is required for auto-fix pushes."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.pr.outputs.allowed == 'true'
        with:
          ref: ${{ steps.pr.outputs.ref }}
          token: ${{ env.GH_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: steps.pr.outputs.allowed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        if: steps.pr.outputs.allowed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node
        if: steps.pr.outputs.allowed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Node deps
        if: steps.pr.outputs.allowed == 'true'
        run: |
          npm ci
          # F-NPM-002: lockfile-integrity gate — refuse to run
          # automated fixes against a tampered lockfile.
          npm audit signatures

      - name: Fix Ruff formatting
        if: steps.pr.outputs.allowed == 'true'
        run: |
          ruff format backend/app backend/tests backend/benchmarks scripts 2>&1 || true

      - name: Fix Prettier formatting
        if: steps.pr.outputs.allowed == 'true'
        run: |
          npx prettier --write 'frontend/**/*.{js,css,html,mjs}' \
            'grafana/**/*.json' 'package.json' '.stylelintrc.json' '.prettierrc' 2>&1 || true

      - name: Commit and push fixes
        if: steps.pr.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ No formatting changes needed."
          else
            git commit -m "style: auto-fix formatting [skip actions]"
            git push
            echo "✅ Formatting fixes committed and pushed."
          fi
