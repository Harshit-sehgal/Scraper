name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATAFORGE_DOTENV_PATH: /dev/null
  DATAFORGE_ENV: test
  DATAFORGE_STORAGE_BACKEND: sqlite
  DATAFORGE_API_KEY: ci-api-key
  DATAFORGE_OPERATOR_API_KEY: ci-operator-key
  DATAFORGE_ADMIN_API_KEY: ci-admin-key
  DATAFORGE_SESSION_SECRET: ci-session-secret
  DATAFORGE_ALLOW_INSECURE_DEV_AUTH: false
  DATAFORGE_SKIP_DB_CHECK: true
  PYTHONPATH: backend

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright
        run: python3 -m playwright install chromium

      - name: Compile check
        run: python3 -m compileall -q backend scripts architecture_validator.py

      - name: Architecture validator
        run: python3 architecture_validator.py

      - name: Research boundary
        run: python3 scripts/check_research_boundary.py

      - name: Dependency bounds
        run: python3 scripts/validate_dependency_bounds.py

      - name: URL safety + research boundary tests
        run: python3 -m pytest backend/tests/test_url_safety.py backend/tests/test_research_boundary.py -q

      - name: P0 regression tests
        run: python3 -m pytest backend/tests/test_p0_auth_tenant.py backend/tests/test_p0_billing_usage.py backend/tests/test_route_auth_matrix_generator.py -q

      - name: OpenAPI spec validation
        run: python3 scripts/generate_route_inventory.py --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: python3 -m mypy backend/ --ignore-missing-imports

  frontend:
    name: Frontend (Node 22, vitest, esbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 22
        uses: actions/setup-node@1d0ff469b7ec7b37248b4554cffa4fc52b042cf4 # v4
        with:
          node-version: "22"
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Frontend unit tests (vitest)
        run: npm run test -- --reporter=verbose

      - name: Frontend build (esbuild)
        run: npm run build

      - name: Frontend lint (eslint + stylelint + prettier)
        run: npm run lint

      - name: Verify dist output
        run: |
          test -f frontend/dist/app.js || (echo "ERROR: frontend/dist/app.js missing" && exit 1)
          test -f frontend/dist/styles.css || (echo "ERROR: frontend/dist/styles.css missing" && exit 1)
          test -f frontend/dist/manifest.json || (echo "ERROR: frontend/dist/manifest.json missing" && exit 1)

  image-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: dataforge:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke production image without network
        run: |
          docker run --rm \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user=65534:65534 \
            dataforge:ci-test \
            python -c "import app.main; print('app.main import ok')"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright
        run: python3 -m playwright install chromium

      - name: Run unit tests
        run: python3 -m pytest backend/tests/ -m "not postgres and not browser and not golden_dataset and not hostile_ci_smoke and not network and not integration" -q --timeout=30 --cov=backend/app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
