name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov mypy pyflakes autoflake types-beautifulsoup4 types-openpyxl types-requests types-html5lib types-webencodings g4f

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Lint with pyflakes
        run: python -m pyflakes backend/app backend/tests

      - name: Type check with mypy
        run: python -m mypy backend/app --ignore-missing-imports

      - name: Run Architecture Validation
        run: python architecture_validator.py

      - name: Test with pytest
        working-directory: backend
        run: PYTHONPATH=. python -m pytest -q -o "addopts="
