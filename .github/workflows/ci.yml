name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov mypy pyflakes autoflake

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Lint with pyflakes
        run: python -m pyflakes backend/ --exclude backend/venv

      - name: Check unused imports with autoflake
        run: python -m autoflake --check --recursive backend/app/ backend/tests/

      - name: Type check with mypy
        run: python -m mypy backend/ --check-untyped-defs --ignore-missing-imports

      - name: Test with pytest and coverage
        run: python -m pytest backend/tests/ --cov=backend/app --cov-report=term-missing --cov-fail-under=60 -v
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
