name: CI
# Trigger run to test Telegram notification

on:
  push:
    branches: [main, fix/deep-scan-hardening]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  ci-gates:
    name: Mandatory CI Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Python syntax check (compileall)
        run: python -m compileall -q backend/app scripts architecture_validator.py

      - name: Run Architecture Validation
        run: PYTHONPATH=backend python architecture_validator.py

      - name: Run Research-Shell Boundary Check
        run: PYTHONPATH=backend python scripts/check_research_boundary.py

      - name: Validate Dependency Bounds
        run: python scripts/validate_dependency_bounds.py

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Benchmark Smoke Test (SQLite)
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m pytest -q backend/benchmarks -o addopts= --tb=short

      - name: Generate Route Authorization Matrix
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python scripts/route_auth_matrix.py --format markdown

      - name: Validate Production Env Checker (Asserts Failure)
        run: |
          # The placeholder production env file should fail validation
          if env -i PATH="$PATH" PYTHONPATH=backend DATAFORGE_SKIP_DB_CHECK=true python scripts/check_prod_env.py --env-file .env.production.example; then
            echo "❌ ERROR: check_prod_env.py unexpectedly passed on placeholder .env.production.example!"
            exit 1
          else
            echo "✅ check_prod_env.py correctly failed on placeholder secrets (expected behaviour)."
          fi

  lint-type-checks:
    name: Lint, Type & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install ruff mypy bandit types-beautifulsoup4 types-openpyxl types-requests types-html5lib types-webencodings

      - name: Run Ruff Lint
        run: ruff check backend/app backend/tests

      - name: Run Ruff Format Check
        run: ruff format --check backend/app backend/tests

      - name: Run Mypy Typecheck
        run: python -m mypy backend/app backend/tests --check-untyped-defs

      - name: Run Bandit Security Scan
        run: python -m bandit -r backend/app -q

      - name: Run Full Test Suite (SQLite)
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite           python -m pytest -q backend/tests -o addopts= --tb=short

  notify:
    name: Telegram Notification
    needs: [ci-gates, lint-type-checks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔔 CI Workflow Status: ${{ (needs.ci-gates.result == 'success' && needs.lint-type-checks.result == 'success') && '✅ Passed' || '❌ Failed' }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            Author: ${{ github.actor }}
