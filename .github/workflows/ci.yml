# =============================================================================
# DataForge Scraper — CI Pipeline
# =============================================================================
# Runs on every push to main and every pull request.
# Checks: tests + coverage, mypy, pyflakes, autoflake
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: /home/runner/work/scraper/scraper/backend
  PYTHONUNBUFFERED: 1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-cov mypy pyflakes autoflake

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Lint — autoflake (unused imports)
        run: |
          python -m autoflake --check --recursive backend/app/

      - name: Lint — pyflakes
        run: |
          python -m pyflakes backend/app/ 2>&1 | grep -v "^backend/app/__pycache__"

      - name: Type check — mypy
        run: |
          python -m mypy backend/app/ --ignore-missing-imports

      - name: Test — pytest with coverage
        run: |
          python -m pytest backend/tests/ \
            --cov=backend/app \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
