name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new push lands, so
# an obsolete CI run does not burn minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast checks (no Playwright browser download) ───────────────────
  ci-gates-fast:
    name: Fast CI Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Python syntax check (compileall)
        run: python -m compileall -q backend/app scripts architecture_validator.py

      - name: Run Architecture Validation
        run: PYTHONPATH=backend python architecture_validator.py

      - name: Run Research-Shell Boundary Check
        run: PYTHONPATH=backend python scripts/check_research_boundary.py

      - name: Validate Dependency Bounds
        run: python scripts/validate_dependency_bounds.py

      - name: Run Dependency Vulnerability Audit
        run: |
          # pip-audit is included via pyproject.toml. Audits the production
          # dependencies to catch CVEs in anything that ends up in the image.
          pip-audit . --strict

      - name: Generate Route Authorization Matrix
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python scripts/route_auth_matrix.py --format markdown

      - name: Validate Production Env Checker (Asserts Failure)
        run: |
          # The placeholder production env file should fail validation
          if env -i PATH="$PATH" PYTHONPATH=backend DATAFORGE_SKIP_DB_CHECK=true python scripts/check_prod_env.py --env-file .env.production.example; then
            echo "❌ ERROR: check_prod_env.py unexpectedly passed on placeholder .env.production.example!"
            exit 1
          else
            echo "✅ check_prod_env.py correctly failed on placeholder secrets (expected behaviour)."
          fi

      - name: Run Contract Smoke Tests (OpenAPI, CSP, Worker Heartbeat, Metadata)
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m pytest backend/tests/test_contract_smoke.py -q -o addopts= --tb=short

      - name: Validate Grafana Dashboard JSON Structure
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m pytest backend/tests/test_grafana_dashboard.py -q -o addopts= --tb=short

      - name: Validate shell scripts
        run: |
          bash -n scripts/start.sh

      - name: Check for committed runtime artifacts
        run: |
          git ls-files | grep -E '\.(db|sqlite|sqlite3)$|\.json\.lock$' && exit 1 || echo "No bad runtime artifacts tracked"

      - name: Validate configuration files (YAML and JSON)
        run: |
          find . -name "*.yml" -o -name "*.yaml" | while read f; do
            python -c "import yaml; yaml.safe_load(open('$f')); print('OK:', '$f')" || exit 1
          done
          find . -name "*.json" | while read f; do
            python -m json.tool "$f" >/dev/null || exit 1
          done

      - name: Validate nginx config
        run: |
          # Generate self-signed certs so nginx -t can successfully load SSL directives
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -sha256 -days 1 -nodes -subj "/CN=localhost"
          export DATAFORGE_TLS_CERT="/etc/nginx/cert.pem"
          export DATAFORGE_TLS_KEY="/etc/nginx/key.pem"
          envsubst '$DATAFORGE_TLS_CERT $DATAFORGE_TLS_KEY' < nginx.conf > nginx.conf.validated
          docker run --rm \
            -v "$PWD/nginx.conf.validated:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/cert.pem:/etc/nginx/cert.pem:ro" \
            -v "$PWD/key.pem:/etc/nginx/key.pem:ro" \
            nginx:alpine nginx -t

      - name: Validate prometheus config
        run: |
          # Mount entire project root so referenced files (prometheus_alerts.yml) are resolvable
          docker run --rm -v "$PWD:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml

      - name: Run SRE quick check
        run: |
          bash scripts/sre_quick_check.sh

  # ── Benchmarks (needs Playwright browser — cached) ────────────────
  ci-gates-benchmarks:
    name: In-Corpus Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache Playwright Chromium browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium (cached)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps (no browser download)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run In-Corpus Benchmarks (SQLite, skipped markers excluded)
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m pytest -q backend/benchmarks \
            -m "not live_benchmark and not browser" \
            -o addopts= --tb=short

      - name: Run Live Benchmark Governance Check
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m pytest -q backend/tests/test_benchmark_governance.py \
            -o addopts= --tb=short

  # ── Lint, type & security checks ─────────────────────────────────
  lint-type-checks:
    name: Lint, Type & Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from lockfile first (mypy, ruff, bandit are pinned here).
          pip install -e ".[dev]"
          # Type stubs and extra tools not in the lockfile.
          pip install types-beautifulsoup4 types-openpyxl types-requests types-html5lib types-webencodings

      - name: Run Ruff Lint
        run: ruff check backend/app backend/tests backend/benchmarks scripts

      - name: Run Ruff Format Check
        run: ruff format --check backend/app backend/tests backend/benchmarks scripts

      - name: Run Mypy Typecheck
        run: python -m mypy backend/app backend/tests --check-untyped-defs

      - name: Run Bandit Security Scan
        run: python -m bandit -r backend/app -q

      - name: Frontend Syntax Check
        run: python scripts/frontend_syntax_check.py

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies (stylelint)
        run: npm ci

      - name: CSS Lint (stylelint)
        run: npx stylelint 'frontend/**/*.css'

      - name: JS/CSS/JSON Format Check (Prettier)
        run: npx prettier --check 'frontend/**/*.{js,css,html,mjs}' 'grafana/**/*.json' 'package.json' '.stylelintrc.json' '.prettierrc'

      - name: Frontend Unit Tests (vitest)
        run: npm test

      - name: Verify Frontend Assets Exist
        run: |
          missing=false
          for f in frontend/app.js frontend/styles.css frontend/favicon.svg frontend/index.html; do
            if [ ! -f "$f" ]; then
              echo "❌ MISSING: $f"
              missing=true
            else
              echo "✅ $f exists ($(stat --format=%s "$f") bytes)"
            fi
          done
          # Verify index.html uses relative paths for assets (the dev server
          # mounts frontend at /app; absolute paths would 404).
          if grep -q 'src="/app.js"' frontend/index.html || grep -q 'href="/styles.css"' frontend/index.html; then
            echo "❌ index.html still uses absolute asset paths (dev server will 404)"
            missing=true
          fi
          if [ "$missing" = true ]; then
            exit 1
          fi
          echo "✅ All frontend assets present and paths are relative"

      - name: Docs Lint
        run: python scripts/docs_lint.py --include-experimental

      - name: Generate Route Inventory Artifact
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python scripts/route_inventory.py > route-inventory.md
        continue-on-error: false

      - name: Upload Route Inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-inventory
          path: route-inventory.md
          retention-days: 30

      # Run the full test suite serially with flaky retry. Several tests
      # share module-level singletons (domain policy, scrape telemetry,
      # SQLite databases) which makes the suite inherently order-sensitive.
      # Parallel execution (-n auto) introduced occasional SQLite lock
      # contention and singleton-state races; serial execution is reliable
      # at ~3 min 30 s on a 4-core runner.
      - name: Run Full Test Suite (SQLite, serial + retry)
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m pytest --reruns 3 --reruns-delay 10 \
            -q backend/tests -o addopts= --tb=short

      - name: Enforce coverage floors
        run: |
          PYTHONPATH=backend DATAFORGE_DOTENV_PATH=/dev/null DATAFORGE_STORAGE_BACKEND=sqlite \
          python -m coverage run --source=backend/app \
            -m pytest --reruns 3 --reruns-delay 10 \
            -q backend/tests -o addopts= --tb=line --no-cov-on-fail
          python -m coverage json -o coverage.json
          python scripts/check_coverage_floors.py coverage.json
          python -m coverage report --fail-under=60
        continue-on-error: false

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
          retention-days: 30

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Use the official Anchore SBOM action which bundles the syft
      # binary.  The previous ``pip install syft`` installed OpenMined's
      # PySyft (privacy-preserving ML library) instead of Anchore's
      # syft SBOM scanner — the PyPI package names collide.
      # Pinned to v0.24.0 for supply-chain integrity.
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          output-file: backend-sbom.cdx.json
          format: cyclonedx-json
          exclude: node_modules,frontend/node_modules,.venv,venv,.git,__pycache__,*.pyc,.pytest_cache,.mypy_cache,.ruff_cache,*.log,backend/data,exports,output,outputs,reports

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: backend-sbom.cdx.json
          retention-days: 30

  notify:
    name: Telegram Notification
    needs: [ci-gates-fast, ci-gates-benchmarks, lint-type-checks, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && secrets.TELEGRAM_TOKEN != '' && secrets.TELEGRAM_TO != ''
    steps:
      - name: Send Telegram Message
        # Pinned to a specific commit SHA for supply-chain integrity.
        # Update via Dependabot (or manual bump) when upstream ships.
        # See: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
        uses: appleboy/telegram-action@37056891d444f558225b59f0d26b4b05c5e9828b # master @ 2026-04-08
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔔 CI Workflow Status: ${{ (needs.ci-gates-fast.result == 'success' && needs.ci-gates-benchmarks.result == 'success' && needs.lint-type-checks.result == 'success' && needs.sbom.result == 'success') && '✅ Passed' || '❌ Failed' }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            Author: ${{ github.actor }}
