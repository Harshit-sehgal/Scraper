name: Postgres Integration Tests

on:
  schedule:
    # Weekly on Sundays at 1 AM UTC
    - cron: '0 1 * * 0'
  workflow_dispatch: # Allows manual trigger

jobs:
  postgres-tests:
    name: Postgres Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATAFORGE_STORAGE_BACKEND: postgres
      DATAFORGE_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-postgres-${{ hashFiles('backend/requirements-dev.lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.lock.txt

      - name: Install Playwright Chromium with system deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Postgres tests
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=postgres \
          DATAFORGE_DATABASE_URL=postgresql://testuser:testpassword@localhost:5432/testdb \
          python -m pytest -v backend/tests --run-postgres -o addopts= \
          --tb=short --reruns 3 --reruns-delay 10

  notify:
    name: Telegram Notification
    needs: [postgres-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@37056891d444f558225b59f0d26b4b05c5e9828b
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔔 Postgres Integration Tests Status: ${{ needs.postgres-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            Author: ${{ github.actor }}
