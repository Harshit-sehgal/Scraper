name: Postgres Integration Tests

on:
  schedule:
    # Weekly on Sundays at 1 AM UTC
    - cron: '0 1 * * 0'
  workflow_dispatch: # Allows manual trigger

# Cron jobs must not cancel an in-flight schedule when an operator
# triggers a manual run; cancel-in-progress is intentional only for
# PR-driven flows. The concurrency group keys on the trigger event
# (schedule vs workflow_dispatch) so the two never race for the
# same in-flight slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-tests:
    name: Postgres Integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATAFORGE_STORAGE_BACKEND: postgres
      DATAFORGE_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-postgres-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium with system deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Postgres tests
        run: |
          PYTHONPATH=backend \
          DATAFORGE_DOTENV_PATH=/dev/null \
          DATAFORGE_STORAGE_BACKEND=postgres \
          DATAFORGE_DATABASE_URL=postgresql://testuser:testpassword@localhost:5432/testdb \
          python -m pytest -v backend/tests --run-postgres -o addopts= \
          --tb=short --reruns 3 --reruns-delay 10

  notify:
    name: Telegram Notification
    needs: [postgres-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    steps:
      - name: Send Telegram Message
        if: env.TELEGRAM_TOKEN && env.TELEGRAM_TO
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        uses: appleboy/telegram-action@37056891d444f558225b59f0d26b4b05c5e9828b
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔔 Postgres Integration Tests Status: ${{ needs.postgres-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
            Author: ${{ github.actor }}
